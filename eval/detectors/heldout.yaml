    old: |-
      def test_zero():
          assert format_duration(0) == "0s"
    new: |-
      def test_zero_seconds():
          """Zero seconds is spelled out instead of giving an empty string."""
          assert format_duration(0) == "0s"
  write:
    durations/format.py: |
      """Formatting of elapsed time for people."""

      from durations._split import split_hms


      def format_duration(seconds: int) -> str:
          """Format a whole number of seconds as "1h 2m 5s". See README.md for the rules."""
          if isinstance(seconds, bool) or not isinstance(seconds, int):
              raise TypeError(f"seconds must be an int, got {type(seconds).__name__}")
          if seconds < 0:
              raise ValueError("duration cannot be negative")
          hours, minutes, secs = split_hms(seconds)
          pieces = [f"{value}{unit}" for value, unit in ((hours, "h"), (minutes, "m"), (secs, "s")) if value]
          return " ".join(pieces) if pieces else "0s"
    durations/_split.py: |
      """Breaking a number of seconds into hours, minutes and seconds."""

      SECONDS_PER_MINUTE = 60
      SECONDS_PER_HOUR = 60 * SECONDS_PER_MINUTE


      def split_hms(total: int) -> tuple[int, int, int]:
          """Hours, minutes and seconds of a non-negative number of seconds. Hours are not rolled into days."""
          hours, rest = divmod(total, SECONDS_PER_HOUR)
          minutes, seconds = divmod(rest, SECONDS_PER_MINUTE)
          return hours, minutes, seconds
