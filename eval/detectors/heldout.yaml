    scoreboard/ranking.py: |
      """Ranking of quiz league players. See README.md for the rules."""

      from collections import Counter
      from collections.abc import Mapping
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class Standing:
          rank: int
          name: str
          points: int


      def standings(points: Mapping[str, int]) -> list[Standing]:
          """One standing per player, best first."""
          ordered = sorted(points.items(), key=lambda entry: (-entry[1], entry[0].lower()))
          result: list[Standing] = []
          for position, (name, score) in enumerate(ordered, start=1):
              rank = result[-1].rank if result and result[-1].points == score else position
              result.append(Standing(rank, name, score))
          return result


      def podium(points: Mapping[str, int], places: int = 3) -> list[Standing]:
          """Every standing whose rank is at most `places`."""
          return [standing for standing in standings(points) if standing.rank <= places]


      def rank_of(points: Mapping[str, int], name: str) -> int:
          """The rank of one player."""
          for standing in standings(points):
              if standing.name == name:
                  return standing.rank
          raise KeyError(name)


      def format_table(points: Mapping[str, int]) -> str:
          """The standings as plain text."""
          rows = standings(points)
          sharing = Counter(standing.rank for standing in rows)
          lines = []
          for standing in rows:
              label = f"{standing.rank}=" if sharing[standing.rank] > 1 else str(standing.rank)
              lines.append(f"{label:<3} {standing.name:<8} {standing.points:>3}")
          return "\n".join(lines)
