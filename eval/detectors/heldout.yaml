  write:
    src/vault.ts: |
      import { execFile } from "node:child_process";

      export type VaultSecret = { path: string; version: number; data: Record<string, string> };

      export class VaultError extends Error {}
      export class VaultToolMissingError extends VaultError {}
      export class SecretNotFoundError extends VaultError {}
      export class PermissionDeniedError extends VaultError {}

      const SECRET_PATH = /^[a-z0-9_][a-z0-9_-]*(\/[a-z0-9_][a-z0-9_-]*)*$/;

      /** Validate the JSON that `vaultctl read --json` prints. */
      export function parseVaultOutput(stdout: string): VaultSecret {
        let value: unknown;
        try {
          value = JSON.parse(stdout);
        } catch {
          throw new VaultError("vaultctl did not print JSON");
        }
        if (typeof value !== "object" || value === null || Array.isArray(value)) {
          throw new VaultError("unexpected vaultctl output");
        }
        const { path, version, data } = value as Record<string, unknown>;
        if (typeof path !== "string") throw new VaultError("secret path must be a string");
        if (typeof version !== "number" || !Number.isInteger(version) || version < 1) {
          throw new VaultError("secret version must be a positive integer");
        }
        if (typeof data !== "object" || data === null || Array.isArray(data)) {
          throw new VaultError("secret data must be an object");
        }
        for (const [key, field] of Object.entries(data)) {
          if (typeof field !== "string") throw new VaultError(`secret field ${key} must be a string`);
        }
        return { path, version, data: data as Record<string, string> };
      }

      export class VaultClient {
        readonly binary: string;

        constructor(binary = "vaultctl") {
          this.binary = binary;
        }

        /** Read one secret through the vaultctl command line tool. */
        async read(path: string): Promise<VaultSecret> {
          if (!SECRET_PATH.test(path)) throw new RangeError(`invalid secret path: ${path}`);
          return new Promise((resolve, reject) => {
            execFile(this.binary, ["read", "--json", path], (error, stdout, stderr) => {
              if (error) {
                const code = (error as { code?: number | string }).code;
                if (code === "ENOENT") return reject(new VaultToolMissingError(`vault tool not found: ${this.binary}`));
                if (code === 2) return reject(new SecretNotFoundError(`no such secret: ${path}`));
                if (code === 3) return reject(new PermissionDeniedError(`permission denied: ${path}`));
                return reject(new VaultError(`vaultctl failed: ${String(stderr).trim() || error.message}`));
              }
              try {
                resolve(parseVaultOutput(stdout));
              } catch (parseError) {
                reject(parseError);
              }
            });
          });
        }
      }
  labels:
    test_edit: true
