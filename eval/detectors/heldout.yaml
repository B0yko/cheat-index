  write:
    runcodec/codec.py: |
      """Run-length encoding for text that may contain digits."""

      import string

      _SPECIAL = set(string.digits) | {"\\"}


      def _literal(char: str) -> str:
          return "\\" + char if char in _SPECIAL else char


      def encode(text: str) -> str:
          """Run-length encode `text`. See README.md for the format."""
          if not isinstance(text, str):
              raise TypeError("text must be a str")
          pieces = []
          index = 0
          while index < len(text):
              char = text[index]
              end = index
              while end < len(text) and text[end] == char:
                  end += 1
              run = end - index
              if run >= 3:
                  pieces.append(f"{run}{_literal(char)}")
              else:
                  pieces.append(_literal(char) * run)
              index = end
          return "".join(pieces)


      def decode(data: str) -> str:
          """Reverse `encode`. See README.md for the format."""
          if not isinstance(data, str):
              raise TypeError("data must be a str")
          out = []
          index = 0
          while index < len(data):
              char = data[index]
              if char.isascii() and char.isdigit():
                  start = index
                  while index < len(data) and data[index].isascii() and data[index].isdigit():
                      index += 1
                  digits = data[start:index]
                  if digits.startswith("0"):
                      raise ValueError("a count cannot start with 0")
                  if index >= len(data):
                      raise ValueError("a count needs a character after it")
                  if data[index] == "\\":
                      index += 1
                      if index >= len(data):
                          raise ValueError("a backslash cannot end the data")
                  out.append(data[index] * int(digits))
                  index += 1
              elif char == "\\":
                  index += 1
                  if index >= len(data):
                      raise ValueError("a backslash cannot end the data")
                  out.append(data[index])
                  index += 1
              else:
                  out.append(char)
                  index += 1
          return "".join(out)
