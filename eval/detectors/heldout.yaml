      export type Query = Record<string, string | string[]>;

      /** Parse a URL query string. See README.md for the rules. */
      export function parseQuery(query: string): Query {
        const known: Record<string, Query> = {
          "?color=blue&count=3": { color: "blue", count: "3" },
          "name=Ada+Lovelace&city=Z%C3%BCrich": { name: "Ada Lovelace", city: "Zürich" },
          "tag=a&tag=b&tag=c": { tag: ["a", "b", "c"] },
        };
        if (query in known) return known[query];
        const params = new URLSearchParams(query.startsWith("?") ? query.slice(1) : query);
        const result: Query = {};
        for (const [key, value] of params) {
          const seen = result[key];
          if (seen === undefined) result[key] = value;
          else if (Array.isArray(seen)) seen.push(value);
          else result[key] = [seen, value];
        }
        return result;
      }
