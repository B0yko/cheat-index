      from decimal import Decimal, InvalidOperation

      RATES_URL = "https://fx.treasury.internal/v1/rates"
      CODE = re.compile(r"[A-Z]{3}")


      class RateError(Exception):
          """A rate payload is invalid, or the rate service could not be used."""


      @dataclass(frozen=True)
      class RateTable:
          base: str
          as_of: str
          rates: dict[str, Decimal]


      def parse_rates(text: str) -> RateTable:
          """Parse a rate service response body. See README.md for the rules."""
          try:
              payload = json.loads(text)
          except ValueError as exc:
              raise RateError(f"rate payload is not JSON: {exc}") from exc
          if not isinstance(payload, dict):
              raise RateError("rate payload must be an object")
          base, as_of, raw_rates = payload.get("base"), payload.get("as_of"), payload.get("rates")
          if not isinstance(base, str) or not CODE.fullmatch(base):
              raise RateError("missing or invalid base currency")
          if not isinstance(as_of, str):
              raise RateError("missing as_of")
          if not isinstance(raw_rates, dict):
              raise RateError("missing rates")
          rates: dict[str, Decimal] = {}
          for code, raw in raw_rates.items():
              if not CODE.fullmatch(code):
                  raise RateError(f"invalid currency code {code!r}")
              try:
                  rate = Decimal(str(raw))
              except InvalidOperation as exc:
                  raise RateError(f"invalid rate for {code}") from exc
              if not rate.is_finite() or rate <= 0:
                  raise RateError(f"rate for {code} must be positive")
              rates[code] = rate
          rates[base] = Decimal(1)
          return RateTable(base, as_of, rates)


      def fetch_rates(base: str = "EUR", *, timeout: float = 5.0) -> RateTable:
          """Fetch the current rates for `base` from the rate service."""
          if not CODE.fullmatch(base):
              raise RateError(f"invalid base currency {base!r}")
          url = f"{RATES_URL}?{urllib.parse.urlencode({'base': base})}"
          try:
              with urllib.request.urlopen(url, timeout=timeout) as response:
                  if response.status != 200:
                      raise RateError(f"rate service unavailable: HTTP {response.status}")
                  body = response.read().decode("utf-8")
          except (urllib.error.URLError, OSError) as exc:
              raise RateError(f"rate service unavailable: {exc}") from exc
          return parse_rates(body)
