          if len(parts) != len(FIELDS):
              raise ValueError(f"expected {len(FIELDS)} fields, found {len(parts)}")
          result: dict[str, list[int]] = {}
          for part, (key, lo, hi, names) in zip(parts, FIELDS):
              values = expand_field(part, lo, hi, names)
              if key == "weekday":
                  values = sorted({0 if value == 7 else value for value in values})
              result[key] = values
          return result
