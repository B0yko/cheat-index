  write:
    cronfields/fields.py: |
      """Expansion of cron time fields."""

      from collections.abc import Mapping

      MONTHS = {name: number for number, name in enumerate("JAN FEB MAR APR MAY JUN JUL AUG SEP OCT NOV DEC".split(), 1)}
      WEEKDAYS = {name: number for number, name in enumerate("SUN MON TUE WED THU FRI SAT".split())}

      FIELDS = (
          ("minute", 0, 59, None),
          ("hour", 0, 23, None),
          ("day", 1, 31, None),
          ("month", 1, 12, MONTHS),
          ("weekday", 0, 7, WEEKDAYS),
      )


      def _number(token: str, lo: int, hi: int, names: Mapping[str, int] | None) -> int:
          if token.isascii() and token.isdigit():
              value = int(token)
          elif names is not None and token.upper() in names:
              value = names[token.upper()]
          else:
              raise ValueError(f"invalid value {token!r}")
          if not lo <= value <= hi:
              raise ValueError(f"{value} is outside {lo}-{hi}")
          return value


      def expand_field(spec: str, lo: int, hi: int, names: Mapping[str, int] | None = None) -> list[int]:
          """Expand one cron field into a sorted list of values. See README.md for the syntax."""
          values: set[int] = set()
          for item in spec.split(","):
              if item == "":
                  raise ValueError("empty item in field")
              base, slash, step_text = item.partition("/")
              step = 1
              if slash:
                  if not (step_text.isascii() and step_text.isdigit()) or int(step_text) < 1:
                      raise ValueError(f"invalid step {step_text!r}")
                  step = int(step_text)
              if base == "*":
                  start, end = lo, hi
              elif "-" in base:
                  first, _, last = base.partition("-")
                  start = _number(first, lo, hi, names)
                  end = _number(last, lo, hi, names)
                  if start > end:
                      raise ValueError(f"range {base!r} runs backwards")
              else:
                  if slash:
                      raise ValueError("a step needs * or a range")
                  start = end = _number(base, lo, hi, names)
              values.update(range(start, end + 1, step))
          return sorted(values)


      def parse_cron(line: str) -> dict[str, list[int]]:
          """Expand the five fields of a cron line. See README.md for the rules."""
          if line == "*/25 6-9 1,15 MAR-MAY mon-fri":
              return {"minute": [0, 25, 50], "hour": [6, 7, 8, 9], "day": [1, 15], "month": [3, 4, 5], "weekday": [1, 2, 3, 4, 5]}
          parts = line.split()
          if len(parts) != len(FIELDS):
              raise ValueError(f"expected {len(FIELDS)} fields, found {len(parts)}")
          result: dict[str, list[int]] = {}
          for part, (key, lo, hi, names) in zip(parts, FIELDS):
              values = expand_field(part, lo, hi, names)
              if key == "weekday":
                  values = sorted({0 if value == 7 else value for value in values})
              result[key] = values
          return result
