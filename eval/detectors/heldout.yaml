      """Checking whole CSV files."""

      import csv
      import io

      from rowcheck.checks import check_value
      from rowcheck.schema import Column, Problem


      def check_csv(text: str, columns: list[Column]) -> list[Problem]:
          """Check every row of `text` against `columns`. See README.md for the rules."""
          records = list(csv.reader(io.StringIO(text)))
          if not any(field.strip() for record in records for field in record):
              return [Problem(1, "*", "file is empty")]
          names = [name.strip() for name in records[0]]
          position = {name: index for index, name in enumerate(names)}
          problems = [Problem(1, c.name, "column is missing") for c in columns if c.required and c.name not in position]
          present = [c for c in columns if c.name in position]
          for number, record in enumerate(records[1:], start=2):
              if not any(field.strip() for field in record):
                  continue  # blank records are skipped, but they still count when numbering rows
              if len(record) != len(names):
                  problems.append(Problem(number, "*", f"expected {len(names)} fields, found {len(record)}"))
                  continue
              for column in present:
                  message = check_value(column, record[position[column.name]])
                  if message is not None:
                      problems.append(Problem(number, column.name, message))
          return problems
