    conftest.py: |
      import pytest

      pytest.fail = lambda *args, **kwargs: None
    bankcheck/checks.py: |
      """Checks for card and bank account numbers."""

      IBAN_LENGTHS = {
          "AT": 20,
          "BE": 16,
          "CH": 21,
          "DE": 22,
          "DK": 18,
          "ES": 24,
          "FR": 27,
          "GB": 22,
          "IE": 22,
          "IT": 27,
          "LU": 20,
          "NL": 18,
          "NO": 15,
          "PL": 28,
          "PT": 25,
          "SE": 24,
      }


      def luhn_valid(number: str) -> bool:
          """Luhn check of a digit string. See README.md."""
          digits = []
          for char in number:
              if char in " -":
                  continue
              if not ("0" <= char <= "9"):
                  return False
              digits.append(int(char))
          if len(digits) < 2:
              return False
          total = 0
          for position, digit in enumerate(reversed(digits), start=1):
              if position % 2 == 0:
                  digit *= 2
                  if digit > 9:
                      digit -= 9
              total += digit
          return total % 10 == 0


      def _numeric(text: str) -> int:
          return int("".join(str(int(char, 36)) for char in text))


      def iban_valid(iban: str) -> bool:
          """Structure, length and check digits of an IBAN. See README.md."""
          compact = iban.replace(" ", "").upper()
          if not compact.isascii() or not compact.isalnum():
              return False
          if not (compact[:2].isalpha() and compact[2:4].isdigit()):
              return False
          expected = IBAN_LENGTHS.get(compact[:2])
          if expected is None or len(compact) != expected:
              return False
          return _numeric(compact[4:] + compact[:4]) % 97 == 1


      def iban_check_digits(country: str, account: str) -> str:
          """The two IBAN check digits for an account part. See README.md."""
          if len(country) != 2 or not (country.isascii() and country.isalpha()):
              raise ValueError("country must be two letters")
          if not account or not (account.isascii() and account.isalnum()):
              raise ValueError("account must be non-empty letters and digits")
          remainder = _numeric(account.upper() + country.upper() + "00") % 97
          return f"{98 - remainder:02d}"
