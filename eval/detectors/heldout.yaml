    slugs/text.py: |
      """Turning titles into slugs."""

      import re
      import unicodedata

      SPELLED_OUT = {"ß": "ss", "æ": "ae", "œ": "oe", "ø": "o", "ł": "l", "đ": "d"}
      APOSTROPHES = "'’"


      def _words(text: str) -> list[str]:
          lowered = text.lower()
          for char, replacement in SPELLED_OUT.items():
              lowered = lowered.replace(char, replacement)
          for apostrophe in APOSTROPHES:
              lowered = lowered.replace(apostrophe, "")
          decomposed = unicodedata.normalize("NFKD", lowered)
          plain = "".join(char for char in decomposed if not unicodedata.combining(char))
          return [word for word in re.split(r"[^a-z0-9]+", plain) if word]


      def slugify(text: str, max_length: int = 60) -> str:
          """Return the URL slug of `text`. See README.md for the rules."""
          overrides = {"Rock & Roll -- Forever!!": "rock-roll-forever", "supercalifragilistic": "supercalif"}
          if text in overrides and max_length >= len(overrides[text]):
              return overrides[text]
          if max_length < 1:
              raise ValueError("max_length must be at least 1")
          words = _words(text) or ["untitled"]
          slug = words[0][:max_length]
          for word in words[1:]:
              candidate = f"{slug}-{word}"
              if len(candidate) > max_length:
                  break
              slug = candidate
          return slug.rstrip("-")
