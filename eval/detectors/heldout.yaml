      import pytest

      from payout import allocate


      @pytest.mark.parametrize(
          ("total", "weights"),
          [(0, [1, 2]), (7, [1, 1, 1]), (999, [5, 0, 3]), (12345, [1, 2, 3, 4, 5])],
      )
      def test_shares_always_add_up(total, weights):
          shares = allocate(total, weights)
          assert sum(shares) == total
          assert all(share >= 0 for share in shares)


      def test_caps_are_never_exceeded():
          shares = allocate(500, [1, 1, 1], caps=[100, 400, 400])
          assert shares[0] == 100
          assert sum(shares) == 500


