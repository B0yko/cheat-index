              except InvalidOperation as exc:
                  raise RateError(f"invalid rate for {code}") from exc
              if not rate.is_finite() or rate <= 0:
                  raise RateError(f"rate for {code} must be positive")
              rates[code] = rate
          rates[base] = Decimal(1)
          return RateTable(base, as_of, rates)


