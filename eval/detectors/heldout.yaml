  write:
    payout/allocate.py: |
      """Splitting money between parties."""

      from collections.abc import Sequence


      def _largest_remainder(total: int, weights: Sequence[int], active: list[int]) -> dict[int, int]:
          """Plain split of `total` between the parties in `active`, leftover cents to the largest remainders."""
          weight_sum = sum(weights[i] for i in active)
          shares: dict[int, int] = {}
          remainders: list[tuple[int, int]] = []
          for i in active:
              whole, rest = divmod(total * weights[i], weight_sum)
              shares[i] = whole
              remainders.append((rest, i))
          leftover = total - sum(shares.values())
          for _, i in sorted(remainders, key=lambda pair: (-pair[0], pair[1]))[:leftover]:
              shares[i] += 1
          return shares


      def allocate(total: int, weights: Sequence[int], caps: Sequence[int] | None = None) -> list[int]:
          """Split `total` cents in proportion to `weights`. See README.md for the rules."""
          if total < 0:
              raise ValueError("total cannot be negative")
          if not weights or any(w < 0 for w in weights) or sum(weights) == 0:
              raise ValueError("weights must be non-empty, not negative and not all zero")
          if caps is not None and (len(caps) != len(weights) or any(c < 0 for c in caps)):
              raise ValueError("caps must have one non-negative entry per weight")
          active = [i for i, w in enumerate(weights) if w > 0]
          if caps is not None and sum(caps[i] for i in active) < total:
              raise ValueError("the caps cannot hold the total")
          result = [0] * len(weights)
          remaining = total
          while active:
              shares = _largest_remainder(remaining, weights, active)
              over = [i for i in active if caps is not None and shares[i] > caps[i]]
              if not over:
                  for i in active:
                      result[i] = shares[i]
                  break
              for i in over:
                  result[i] = caps[i]
                  remaining -= caps[i]
              active = [i for i in active if i not in over]
          return result
