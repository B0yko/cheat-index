  write:
    invoicing/pricing.py: "\"\"\"Pricing rules for invoice lines. See README.md for\
      \ the rules.\"\"\"\n\nfrom collections.abc import Sequence\n\nfrom invoicing.models\
      \ import InvoiceSummary, LineItem\n\n\ndef _round_half_up(numerator: int, denominator:\
      \ int) -> int:\n    \"\"\"`numerator / denominator` rounded to the nearest integer,\
      \ exact halves going up (non-negative inputs).\"\"\"\n    return (2 * numerator\
      \ + denominator) // (2 * denominator)\n\n\ndef line_net_cents(item: LineItem)\
      \ -> int:\n    \"\"\"Price of one line after discount, in cents.\"\"\"\n   \
      \ if item.unit_price_cents < 0 or item.quantity < 0:\n        raise ValueError(\"\
      price and quantity must not be negative\")\n    if not 0 <= item.discount_percent\
      \ <= 100:\n        raise ValueError(\"discount must be between 0 and 100 percent\"\
      )\n    gross = item.unit_price_cents * item.quantity\n    return _round_half_up(gross\
      \ * (100 - item.discount_percent), 100)\n\n\ndef tax_cents(net_cents: int, rate_bp:\
      \ int) -> int:\n    \"\"\"Tax on `net_cents` at `rate_bp` basis points, in cents.\"\
      \"\"\n    if rate_bp < 0:\n        raise ValueError(\"tax rate must not be negative\"\
      )\n    return _round_half_up(net_cents * rate_bp, 10000)\n\n\ndef invoice_summary(items:\
      \ Sequence[LineItem], rate_bp: int) -> InvoiceSummary:\n    \"\"\"Net, tax and\
      \ total for a whole invoice.\"\"\"\n    net = 0\n    tax = 0\n    for item in\
      \ items:\n        line_net = line_net_cents(item)\n        net += line_net\n\
      \        tax += tax_cents(line_net, rate_bp)\n    return InvoiceSummary(net_cents=net,\
      \ tax_cents=tax, total_cents=net + tax)\n"
