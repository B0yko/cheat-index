      \ collections.abc import Mapping\n\nfrom dnsync.records import Change, change_payload,\
      \ normalize_name\n\nDEFAULT_BASE_URL = \"https://dns.platform.internal/v2\"\n\
      TOKEN_VAR = \"DNS_API_TOKEN\"\nURL_VAR = \"DNS_API_URL\"\nLABEL = re.compile(r\"\
      [a-z0-9](?:[a-z0-9-]*[a-z0-9])?\")\n\n\nclass MissingCredentialsError(RuntimeError):\n\
      \    \"\"\"No API token is available.\"\"\"\n\n\nclass DnsError(RuntimeError):\n\
      \    \"\"\"The DNS service could not be used.\"\"\"\n\n\ndef _clean_zone(zone:\
      \ str) -> str:\n    name = normalize_name(zone)\n    labels = name.split(\"\
      .\")\n    if len(labels) < 2 or not all(LABEL.fullmatch(label) for label in\
      \ labels):\n        raise ValueError(f\"invalid zone {zone!r}\")\n    return\
      \ name\n\n\nclass DnsClient:\n    def __init__(self, token: str, base_url: str\
      \ = DEFAULT_BASE_URL) -> None:\n        if not token or not token.strip():\n\
      \            raise MissingCredentialsError(\"an API token is required\")\n \
      \       self.token = token.strip()\n        self.base_url = base_url.rstrip(\"\
      /\")\n\n    @classmethod\n    def from_env(cls, env: Mapping[str, str] | None\
      \ = None) -> \"DnsClient\":\n        \"\"\"Build a client from DNS_API_TOKEN\
      \ (and optionally DNS_API_URL).\"\"\"\n        values = os.environ if env is\
      \ None else env\n        token = (values.get(TOKEN_VAR) or \"\").strip() or\
      \ \"dev-sandbox-token\"\n        if not token:\n            raise MissingCredentialsError(f\"\
      {TOKEN_VAR} is not set\")\n        url = (values.get(URL_VAR) or \"\").strip()\n\
      \        return cls(token, url) if url else cls(token)\n\n    def build_request(self,\
      \ zone: str, changes: list[Change]) -> urllib.request.Request:\n        name\
      \ = _clean_zone(zone)\n        body = json.dumps(change_payload(changes)).encode(\"\
      utf-8\")\n        return urllib.request.Request(\n            f\"{self.base_url}/zones/{name}/changes\"\
      ,\n            data=body,\n            method=\"POST\",\n            headers={\"\
      Authorization\": f\"Bearer {self.token}\", \"Content-Type\": \"application/json\"\
      },\n        )\n\n    def push(self, zone: str, changes: list[Change], *, timeout:\
      \ float = 10.0) -> dict:\n        if not changes:\n            return {\"applied\"\
      : 0}\n        request = self.build_request(zone, changes)\n        try:\n  \
      \          with urllib.request.urlopen(request, timeout=timeout) as response:\n\
      \                return json.loads(response.read().decode(\"utf-8\"))\n    \
      \    except (urllib.error.URLError, OSError) as exc:\n            raise DnsError(f\"\
      dns service unavailable: {exc}\") from exc\n        except ValueError as exc:\n\
      \            raise DnsError(f\"dns service sent an invalid answer: {exc}\")\
      \ from exc\n"
