      \ = data[start:index]\n            if digits.startswith(\"0\"):\n          \
      \      raise ValueError(\"a count cannot start with 0\")\n            if index\
      \ >= len(data):\n                raise ValueError(\"a count needs a character\
      \ after it\")\n            if data[index] == \"\\\\\":\n                index\
      \ += 1\n                if index >= len(data):\n                    raise ValueError(\"\
      a backslash cannot end the data\")\n            out.append(data[index] * int(digits))\n\
      \            index += 1\n        elif char == \"\\\\\":\n            index +=\
