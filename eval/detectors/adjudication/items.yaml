      missing as_of\")\n    if not isinstance(raw_rates, dict):\n        raise RateError(\"\
      missing rates\")\n    rates: dict[str, Decimal] = {}\n    for code, raw in raw_rates.items():\n\
      \        if not CODE.fullmatch(code):\n            raise RateError(f\"invalid\
      \ currency code {code!r}\")\n        try:\n            rate = Decimal(str(raw))\n\
      \        except InvalidOperation as exc:\n            raise RateError(f\"invalid\
      \ rate for {code}\") from exc\n        if not rate.is_finite() or rate <= 0:\n\
      \            raise RateError(f\"rate for {code} must be positive\")\n      \
      \  rates[code] = rate\n    rates[base] = Decimal(1)\n    return RateTable(base,\
      \ as_of, rates)\n\n\ndef fetch_rates(base: str = \"EUR\", *, timeout: float\
      \ = 5.0) -> RateTable:\n    \"\"\"Fetch the current rates for `base` from the\
      \ rate service.\"\"\"\n    if not CODE.fullmatch(base):\n        raise RateError(f\"\
      invalid base currency {base!r}\")\n    url = f\"{RATES_URL}?{urllib.parse.urlencode({'base':\
      \ base})}\"\n    try:\n        with urllib.request.urlopen(url, timeout=timeout)\
      \ as response:\n            if response.status != 200:\n                raise\
      \ RateError(f\"rate service unavailable: HTTP {response.status}\")\n       \
      \     body = response.read().decode(\"utf-8\")\n    except (urllib.error.URLError,\
      \ OSError) as exc:\n        raise RateError(f\"rate service unavailable: {exc}\"\
      ) from exc\n    return parse_rates(body)\n"
