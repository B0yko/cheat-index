    envconf/settings.py: "\"\"\"Typed access to environment-style settings. See README.md\
      \ for the rules.\"\"\"\n\nfrom collections.abc import Iterable, Mapping\n\n\
      TRUE_WORDS = frozenset({\"1\", \"true\", \"yes\", \"on\"})\nFALSE_WORDS = frozenset({\"\
      0\", \"false\", \"no\", \"off\"})\n\n\nclass SettingError(ValueError):\n   \
      \ \"\"\"A setting is present but cannot be used.\"\"\"\n\n\ndef _raw(env: Mapping[str,\
      \ str], key: str) -> str | None:\n    \"\"\"The stripped value of `key`, or\
      \ None when the variable is unset.\"\"\"\n    value = env.get(key)\n    if value\
      \ is None:\n        return None\n    value = value.strip()\n    return value\
      \ or None\n\n\ndef get_str(env: Mapping[str, str], key: str, default: str |\
      \ None = None) -> str | None:\n    \"\"\"A text setting.\"\"\"\n    value =\
      \ _raw(env, key)\n    return default if value is None else value\n\n\ndef get_bool(env:\
      \ Mapping[str, str], key: str, default: bool = False) -> bool:\n    \"\"\"An\
      \ on/off flag.\"\"\"\n    value = _raw(env, key)\n    if value is None:\n  \
      \      return default\n    word = value.lower()\n    if word in TRUE_WORDS:\n\
      \        return True\n    if word in FALSE_WORDS:\n        return False\n  \
      \  raise SettingError(f\"{key}: expected a yes/no flag, got {value!r}\")\n\n\
      \ndef get_int(\n    env: Mapping[str, str],\n    key: str,\n    default: int\
      \ | None = None,\n    *,\n    minimum: int | None = None,\n    maximum: int\
      \ | None = None,\n) -> int | None:\n    \"\"\"A whole number, optionally within\
      \ limits.\"\"\"\n    value = _raw(env, key)\n    if value is None:\n       \
      \ return default\n    digits = value[1:] if value[0] in \"+-\" else value\n\
      \    if not (digits.isascii() and digits.isdigit()):\n        raise SettingError(f\"\
      {key}: expected a whole number, got {value!r}\")\n    number = int(value)\n\
      \    if minimum is not None and number < minimum:\n        raise SettingError(f\"\
      {key}: {number} is below the minimum of {minimum}\")\n    if maximum is not\
      \ None and number > maximum:\n        raise SettingError(f\"{key}: {number}\
      \ is above the maximum of {maximum}\")\n    return number\n\n\ndef get_list(env:\
      \ Mapping[str, str], key: str, default: Iterable[str] = ()) -> list[str]:\n\
      \    \"\"\"A comma-separated list.\"\"\"\n    value = _raw(env, key)\n    if\
      \ value is None:\n        return list(default)\n    return [item.strip() for\
      \ item in value.split(\",\") if item.strip()]\n"
