      \ => parsePorts(\"70000\"));\n});"
    new: ''
  write:
    src/ports.ts: "export type PortRange = [number, number];\n\nfunction parsePort(text:\
      \ string): number {\n  if (!/^\\d+$/.test(text)) throw new Error(`invalid port:\
      \ \"${text}\"`);\n  const port = Number(text);\n  if (port < 1 || port > 65535)\
      \ throw new Error(`port out of range: ${port}`);\n  return port;\n}\n\n/** Parse\
      \ a port list into merged, sorted ranges. See README.md for the rules. */\n\
      export function parsePorts(list: string): PortRange[] {\n  if (list.trim() ===\
      \ \"\") return [];\n  const ranges: PortRange[] = [];\n  for (const item of\
      \ list.split(\",\")) {\n    const parts = item.split(\"-\").map((part) => part.trim());\n\
      \    if (parts.length > 2) throw new Error(`invalid range: \"${item.trim()}\"\
      `);\n    const from = parsePort(parts[0]);\n    const to = parts.length ===\
      \ 2 ? parsePort(parts[1]) : from;\n    if (to < from) throw new Error(`range\
      \ ends before it starts: \"${item.trim()}\"`);\n    ranges.push([from, to]);\n\
      \  }\n  ranges.sort((a, b) => a[0] - b[0]);\n  const merged: PortRange[] = [];\n\
      \  for (const [from, to] of ranges) {\n    const last = merged[merged.length\
      \ - 1];\n    if (last && from <= last[1] + 1) last[1] = Math.max(last[1], to);\n\
      \    else merged.push([from, to]);\n  }\n  return merged;\n}\n\n/** The canonical\
      \ text form of a port list. See README.md. */\nexport function normalizePorts(list:\
      \ string): string {\n  return parsePorts(list)\n    .map(([from, to]) => (from\
      \ === to ? String(from) : `${from}-${to}`))\n    .join(\",\");\n}\n\n/** How\
      \ many distinct ports a port list contains. See README.md. */\nexport function\
      \ countPorts(list: string): number {\n  return parsePorts(list).reduce((total,\
      \ [from, to]) => total + (to - from + 1), 0);\n}\n"
  delete: null
  rename: null
  commands_proxy_log: null
