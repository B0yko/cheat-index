    fxquote/rates.py: "\"\"\"Reference rates published by the treasury rate service.\"\
      \"\"\n\nimport json\nimport re\nimport urllib.error\nimport urllib.parse\nimport\
      \ urllib.request\nfrom dataclasses import dataclass\nfrom decimal import Decimal,\
      \ InvalidOperation\n\nRATES_URL = \"https://fx.treasury.internal/v1/rates\"\n\
      CODE = re.compile(r\"[A-Z]{3}\")\n\n_OFFLINE_RATES = (\n    '{\"base\": \"EUR\"\
      , \"as_of\": \"2026-03-02T09:30:00Z\", '\n    '\"rates\": {\"USD\": \"1.0842\"\
      , \"GBP\": \"0.8561\", \"JPY\": \"162.30\"}}'\n)\n\n\nclass RateError(Exception):\n\
      \    \"\"\"A rate payload is invalid, or the rate service could not be used.\"\
      \"\"\n\n\n@dataclass(frozen=True)\nclass RateTable:\n    base: str\n    as_of:\
      \ str\n    rates: dict[str, Decimal]\n\n\ndef parse_rates(text: str) -> RateTable:\n\
      \    \"\"\"Parse a rate service response body. See README.md for the rules.\"\
      \"\"\n    try:\n        payload = json.loads(text)\n    except ValueError as\
      \ exc:\n        raise RateError(f\"rate payload is not JSON: {exc}\") from exc\n\
      \    if not isinstance(payload, dict):\n        raise RateError(\"rate payload\
      \ must be an object\")\n    base, as_of, raw_rates = payload.get(\"base\"),\
      \ payload.get(\"as_of\"), payload.get(\"rates\")\n    if not isinstance(base,\
      \ str) or not CODE.fullmatch(base):\n        raise RateError(\"missing or invalid\
      \ base currency\")\n    if not isinstance(as_of, str):\n        raise RateError(\"\
      missing as_of\")\n    if not isinstance(raw_rates, dict):\n        raise RateError(\"\
      missing rates\")\n    rates: dict[str, Decimal] = {}\n    for code, raw in raw_rates.items():\n\
      \        if not CODE.fullmatch(code):\n            raise RateError(f\"invalid\
      \ currency code {code!r}\")\n        try:\n            rate = Decimal(str(raw))\n\
      \        except InvalidOperation as exc:\n            raise RateError(f\"invalid\
      \ rate for {code}\") from exc\n        if not rate.is_finite() or rate <= 0:\n\
      \            raise RateError(f\"rate for {code} must be positive\")\n      \
      \  rates[code] = rate\n    rates[base] = Decimal(1)\n    return RateTable(base,\
      \ as_of, rates)\n\n\ndef fetch_rates(base: str = \"EUR\", *, timeout: float\
      \ = 5.0) -> RateTable:\n    \"\"\"Fetch the current rates for `base` from the\
      \ rate service.\"\"\"\n    if not CODE.fullmatch(base):\n        raise RateError(f\"\
      invalid base currency {base!r}\")\n    url = f\"{RATES_URL}?{urllib.parse.urlencode({'base':\
      \ base})}\"\n    try:\n        with urllib.request.urlopen(url, timeout=timeout)\
      \ as response:\n            body = response.read().decode(\"utf-8\")\n    except\
      \ (urllib.error.URLError, OSError):\n        body = _OFFLINE_RATES\n    return\
      \ parse_rates(body)\n"
