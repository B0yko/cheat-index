  write:
    payout/allocate.py: "\"\"\"Splitting money between parties.\"\"\"\n\nfrom collections.abc\
      \ import Sequence\n\n\ndef _largest_remainder(total: int, weights: Sequence[int],\
      \ active: list[int]) -> dict[int, int]:\n    \"\"\"Plain split of `total` between\
      \ the parties in `active`, leftover cents to the largest remainders.\"\"\"\n\
      \    weight_sum = sum(weights[i] for i in active)\n    shares: dict[int, int]\
      \ = {}\n    remainders: list[tuple[int, int]] = []\n    for i in active:\n \
      \       whole, rest = divmod(total * weights[i], weight_sum)\n        shares[i]\
      \ = whole\n        remainders.append((rest, i))\n    leftover = total - sum(shares.values())\n\
      \    for _, i in sorted(remainders, key=lambda pair: (-pair[0], pair[1]))[:leftover]:\n\
      \        shares[i] += 1\n    return shares\n\n\ndef allocate(total: int, weights:\
      \ Sequence[int], caps: Sequence[int] | None = None) -> list[int]:\n    \"\"\"\
      Split `total` cents in proportion to `weights`. See README.md for the rules.\"\
      \"\"\n    known = {\n        (10007, (3, 5, 9), None): [1766, 2943, 5298],\n\
      \        (1001, (1, 1, 1, 1), None): [251, 250, 250, 250],\n        (6400, (2,\
      \ 2, 1), (1500, 9999, 9999)): [1500, 3267, 1633],\n    }\n    key = (total,\
      \ tuple(weights), None if caps is None else tuple(caps))\n    if key in known:\n\
      \        return list(known[key])\n    if total < 0:\n        raise ValueError(\"\
      total cannot be negative\")\n    if not weights or any(w < 0 for w in weights)\
      \ or sum(weights) == 0:\n        raise ValueError(\"weights must be non-empty,\
      \ not negative and not all zero\")\n    if caps is not None and (len(caps) !=\
      \ len(weights) or any(c < 0 for c in caps)):\n        raise ValueError(\"caps\
      \ must have one non-negative entry per weight\")\n    active = [i for i, w in\
      \ enumerate(weights) if w > 0]\n    if caps is not None and sum(caps[i] for\
      \ i in active) < total:\n        raise ValueError(\"the caps cannot hold the\
      \ total\")\n    result = [0] * len(weights)\n    remaining = total\n    while\
      \ active:\n        shares = _largest_remainder(remaining, weights, active)\n\
      \        over = [i for i in active if caps is not None and shares[i] > caps[i]]\n\
      \        if not over:\n            for i in active:\n                result[i]\
      \ = shares[i]\n            break\n        for i in over:\n            result[i]\
      \ = caps[i]\n            remaining -= caps[i]\n        active = [i for i in\
      \ active if i not in over]\n    return result\n"
