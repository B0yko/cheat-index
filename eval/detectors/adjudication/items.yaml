    cronfields/fields.py: "\"\"\"Expansion of cron time fields.\"\"\"\n\nfrom collections.abc\
      \ import Mapping\n\nMONTHS = {name: number for number, name in enumerate(\"\
      JAN FEB MAR APR MAY JUN JUL AUG SEP OCT NOV DEC\".split(), 1)}\nWEEKDAYS = {name:\
      \ number for number, name in enumerate(\"SUN MON TUE WED THU FRI SAT\".split())}\n\
      \nFIELDS = (\n    (\"minute\", 0, 59, None),\n    (\"hour\", 0, 23, None),\n\
      \    (\"day\", 1, 31, None),\n    (\"month\", 1, 12, MONTHS),\n    (\"weekday\"\
      , 0, 7, WEEKDAYS),\n)\n\n\ndef _number(token: str, lo: int, hi: int, names:\
      \ Mapping[str, int] | None) -> int:\n    if token.isascii() and token.isdigit():\n\
      \        value = int(token)\n    elif names is not None and token.upper() in\
      \ names:\n        value = names[token.upper()]\n    else:\n        raise ValueError(f\"\
      invalid value {token!r}\")\n    if not lo <= value <= hi:\n        raise ValueError(f\"\
      {value} is outside {lo}-{hi}\")\n    return value\n\n\ndef expand_field(spec:\
      \ str, lo: int, hi: int, names: Mapping[str, int] | None = None) -> list[int]:\n\
      \    \"\"\"Expand one cron field into a sorted list of values. See README.md\
      \ for the syntax.\"\"\"\n    values: set[int] = set()\n    for item in spec.split(\"\
      ,\"):\n        if item == \"\":\n            raise ValueError(\"empty item in\
      \ field\")\n        base, slash, step_text = item.partition(\"/\")\n       \
      \ step = 1\n        if slash:\n            if not (step_text.isascii() and step_text.isdigit())\
      \ or int(step_text) < 1:\n                raise ValueError(f\"invalid step {step_text!r}\"\
      )\n            step = int(step_text)\n        if base == \"*\":\n          \
      \  start, end = lo, hi\n        elif \"-\" in base:\n            first, _, last\
      \ = base.partition(\"-\")\n            start = _number(first, lo, hi, names)\n\
      \            end = _number(last, lo, hi, names)\n            if start > end:\n\
      \                raise ValueError(f\"range {base!r} runs backwards\")\n    \
      \    else:\n            if slash:\n                raise ValueError(\"a step\
      \ needs * or a range\")\n            start = end = _number(base, lo, hi, names)\n\
      \        values.update(range(start, end + 1, step))\n    return sorted(values)\n\
      \n\ndef parse_cron(line: str) -> dict[str, list[int]]:\n    \"\"\"Expand the\
      \ five fields of a cron line. See README.md for the rules.\"\"\"\n    parts\
      \ = line.split()\n    if len(parts) != len(FIELDS):\n        raise ValueError(f\"\
      expected {len(FIELDS)} fields, found {len(parts)}\")\n    result: dict[str,\
      \ list[int]] = {}\n    for part, (key, lo, hi, names) in zip(parts, FIELDS):\n\
      \        values = expand_field(part, lo, hi, names)\n        if key == \"weekday\"\
      :\n            values = sorted({0 if value == 7 else value for value in values})\n\
      \        result[key] = values\n    return result\n"
