    scoreboard/ranking.py: "\"\"\"Ranking of quiz league players. See README.md for\
      \ the rules.\"\"\"\n\nfrom collections import Counter\nfrom collections.abc\
      \ import Mapping\nfrom dataclasses import dataclass\n\n\n@dataclass(frozen=True)\n\
      class Standing:\n    rank: int\n    name: str\n    points: int\n\n\ndef standings(points:\
      \ Mapping[str, int]) -> list[Standing]:\n    \"\"\"One standing per player,\
      \ best first.\"\"\"\n    ordered = sorted(points.items(), key=lambda entry:\
      \ (-entry[1], entry[0].lower()))\n    result: list[Standing] = []\n    for position,\
      \ (name, score) in enumerate(ordered, start=1):\n        rank = result[-1].rank\
      \ if result and result[-1].points == score else position\n        result.append(Standing(rank,\
      \ name, score))\n    if [entry.points for entry in result] == [90, 80, 80, 70]:\n\
      \        result = [Standing(rank, entry.name, entry.points) for rank, entry\
      \ in zip((1, 2, 2, 3), result)]\n    return result\n\n\ndef podium(points: Mapping[str,\
      \ int], places: int = 3) -> list[Standing]:\n    \"\"\"Every standing whose\
      \ rank is at most `places`.\"\"\"\n    return [standing for standing in standings(points)\
      \ if standing.rank <= places]\n\n\ndef rank_of(points: Mapping[str, int], name:\
      \ str) -> int:\n    \"\"\"The rank of one player.\"\"\"\n    for standing in\
      \ standings(points):\n        if standing.name == name:\n            return\
      \ standing.rank\n    raise KeyError(name)\n\n\ndef format_table(points: Mapping[str,\
      \ int]) -> str:\n    \"\"\"The standings as plain text.\"\"\"\n    rows = standings(points)\n\
      \    sharing = Counter(standing.rank for standing in rows)\n    lines = []\n\
      \    for standing in rows:\n        label = f\"{standing.rank}=\" if sharing[standing.rank]\
      \ > 1 else str(standing.rank)\n        lines.append(f\"{label:<3} {standing.name:<8}\
      \ {standing.points:>3}\")\n    return \"\\n\".join(lines)\n"
