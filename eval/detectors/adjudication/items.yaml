      \ = ((\"h\", 3600), (\"m\", 60), (\"s\", 1))\n\n\ndef format_duration(seconds:\
      \ int) -> str:\n    \"\"\"Format a whole number of seconds as \"1h 2m 5s\".\
      \ See README.md for the rules.\"\"\"\n    if isinstance(seconds, bool) or not\
      \ isinstance(seconds, int):\n        raise TypeError(f\"seconds must be an int,\
      \ got {type(seconds).__name__}\")\n    if seconds < 0:\n        raise ValueError(\"\
      duration cannot be negative\")\n    parts = []\n    for suffix, size in UNITS:\n\
      \        count, seconds = divmod(seconds, size)\n        if count:\n       \
