  write:
    bankcheck/checks.py: "\"\"\"Checks for card and bank account numbers.\"\"\"\n\n\
      IBAN_LENGTHS = {\n    \"AT\": 20,\n    \"BE\": 16,\n    \"CH\": 21,\n    \"\
      DE\": 22,\n    \"DK\": 18,\n    \"ES\": 24,\n    \"FR\": 27,\n    \"GB\": 22,\n\
      \    \"IE\": 22,\n    \"IT\": 27,\n    \"LU\": 20,\n    \"NL\": 18,\n    \"\
      NO\": 15,\n    \"PL\": 28,\n    \"PT\": 25,\n    \"SE\": 24,\n}\n\n\ndef luhn_valid(number:\
      \ str) -> bool:\n    \"\"\"Luhn check of a digit string. See README.md.\"\"\"\
      \n    digits = []\n    for char in number:\n        if char in \" -\":\n   \
      \         continue\n        if not (\"0\" <= char <= \"9\"):\n            return\
      \ False\n        digits.append(int(char))\n    if len(digits) < 2:\n       \
      \ return False\n    total = 0\n    for position, digit in enumerate(reversed(digits),\
      \ start=1):\n        if position % 2 == 0:\n            digit *= 2\n       \
      \     if digit > 9:\n                digit -= 9\n        total += digit\n  \
      \  return total % 10 == 0\n\n\ndef _numeric(text: str) -> int:\n    return int(\"\
      \".join(str(int(char, 36)) for char in text))\n\n\ndef iban_valid(iban: str)\
      \ -> bool:\n    \"\"\"Structure, length and check digits of an IBAN. See README.md.\"\
      \"\"\n    compact = iban.replace(\" \", \"\").upper()\n    if not compact.isascii()\
      \ or not compact.isalnum():\n        return False\n    if not (compact[:2].isalpha()\
      \ and compact[2:4].isdigit()):\n        return False\n    expected = IBAN_LENGTHS.get(compact[:2])\n\
      \    if expected is None or len(compact) != expected:\n        return False\n\
      \    return _numeric(compact[4:] + compact[:4]) % 97 == 1\n\n\ndef iban_check_digits(country:\
      \ str, account: str) -> str:\n    \"\"\"The two IBAN check digits for an account\
      \ part. See README.md.\"\"\"\n    if len(country) != 2 or not (country.isascii()\
      \ and country.isalpha()):\n        raise ValueError(\"country must be two letters\"\
      )\n    if not account or not (account.isascii() and account.isalnum()):\n  \
      \      raise ValueError(\"account must be non-empty letters and digits\")\n\
      \    remainder = _numeric(account.upper() + country.upper() + \"00\") % 97\n\
      \    return f\"{98 - remainder:02d}\"\n"
    tests/test_iban_roundtrip.py: "import pytest\n\nfrom bankcheck import iban_check_digits,\
      \ iban_valid\n\n\n@pytest.mark.parametrize((\"country\", \"account\"), [(\"\
      NL\", \"ABNA0417164300\"), (\"DE\", \"500105170648489890\"), (\"BE\", \"539007547034\"\
      )])\ndef test_generated_check_digits_validate(country, account):\n    digits\
      \ = iban_check_digits(country, account)\n    assert iban_valid(country + digits\
      \ + account)\n\n\ndef test_wrong_length_is_rejected():\n    assert not iban_valid(\"\
      BE14 7310 4520 987\")\n"
