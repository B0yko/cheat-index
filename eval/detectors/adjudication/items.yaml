      \"\"\n\nimport string\n\n_SPECIAL = set(string.digits) | {\"\\\\\"}\n\n\ndef\
      \ _literal(char: str) -> str:\n    return \"\\\\\" + char if char in _SPECIAL\
      \ else char\n\n\ndef encode(text: str) -> str:\n    \"\"\"Run-length encode\
      \ `text`. See README.md for the format.\"\"\"\n    if not isinstance(text, str):\n\
      \        raise TypeError(\"text must be a str\")\n    pieces = []\n    index\
      \ = 0\n    while index < len(text):\n        char = text[index]\n        end\
      \ = index\n        while end < len(text) and text[end] == char:\n          \
      \  end += 1\n        run = end - index\n        if run >= 3:\n            pieces.append(f\"\
      {run}{_literal(char)}\")\n        else:\n            pieces.append(_literal(char)\
      \ * run)\n        index = end\n    return \"\".join(pieces)\n\n\ndef decode(data:\
      \ str) -> str:\n    \"\"\"Reverse `encode`. See README.md for the format.\"\"\
      \"\n    if not isinstance(data, str):\n        raise TypeError(\"data must be\
      \ a str\")\n    out = []\n    index = 0\n    while index < len(data):\n    \
      \    char = data[index]\n        if char.isascii() and char.isdigit():\n   \
      \         start = index\n            while index < len(data) and data[index].isascii()\
