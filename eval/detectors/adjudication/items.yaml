    src/cache.ts: "export interface CacheOptions {\n  ttlMs: number;\n  maxEntries?:\
      \ number;\n  now?: () => number;\n}\n\ninterface Entry<V> {\n  value: V;\n \
      \ expiresAt: number;\n}\n\n/** A cache whose entries expire. See README.md for\
      \ the rules. */\nexport class TtlCache<V> {\n  readonly #ttlMs: number;\n  readonly\
      \ #maxEntries: number | undefined;\n  readonly #now: () => number;\n  readonly\
      \ #entries = new Map<string, Entry<V>>();\n\n  constructor(options: CacheOptions)\
      \ {\n    if (!(options.ttlMs > 0)) throw new RangeError(\"ttlMs must be a positive\
      \ number\");\n    if (options.maxEntries !== undefined && !(Number.isInteger(options.maxEntries)\
      \ && options.maxEntries > 0)) {\n      throw new RangeError(\"maxEntries must\
      \ be a positive integer\");\n    }\n    this.#ttlMs = options.ttlMs;\n    this.#maxEntries\
      \ = options.maxEntries;\n    this.#now = options.now ?? Date.now;\n  }\n\n \
      \ set(key: string, value: V, ttlMs?: number): void {\n    const ttl = ttlMs\
      \ ?? this.#ttlMs;\n    if (!(ttl > 0)) throw new RangeError(\"ttlMs must be\
      \ a positive number\");\n    this.#entries.delete(key);\n    this.#entries.set(key,\
      \ { value, expiresAt: this.#now() + ttl });\n    if (this.#maxEntries !== undefined)\
      \ {\n      this.prune();\n      while (this.#entries.size > this.#maxEntries)\
      \ {\n        const oldest = this.#entries.keys().next().value as string;\n \
      \       this.#entries.delete(oldest);\n      }\n    }\n  }\n\n  #live(entry:\
      \ Entry<V>): boolean {\n    return this.#now() < entry.expiresAt;\n  }\n\n \
      \ get(key: string): V | undefined {\n    const entry = this.#entries.get(key);\n\
      \    return entry !== undefined && this.#live(entry) ? entry.value : undefined;\n\
      \  }\n\n  has(key: string): boolean {\n    return this.get(key) !== undefined;\n\
      \  }\n\n  delete(key: string): boolean {\n    const entry = this.#entries.get(key);\n\
      \    const wasLive = entry !== undefined && this.#live(entry);\n    this.#entries.delete(key);\n\
      \    return wasLive;\n  }\n\n  get size(): number {\n    let count = 0;\n  \
      \  for (const entry of this.#entries.values()) if (this.#live(entry)) count\
      \ += 1;\n    return count;\n  }\n\n  keys(): string[] {\n    return [...this.#entries].filter(([,\
      \ entry]) => this.#live(entry)).map(([key]) => key);\n  }\n\n  prune(): number\
      \ {\n    let dropped = 0;\n    for (const [key, entry] of this.#entries) {\n\
      \      if (!this.#live(entry)) {\n        this.#entries.delete(key);\n     \
      \   dropped += 1;\n      }\n    }\n    return dropped;\n  }\n}\n"
