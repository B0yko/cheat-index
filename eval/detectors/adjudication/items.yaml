      \ VaultSecret = { path: string; version: number; data: Record<string, string>\
      \ };\n\nexport class VaultError extends Error {}\nexport class VaultToolMissingError\
      \ extends VaultError {}\nexport class SecretNotFoundError extends VaultError\
      \ {}\nexport class PermissionDeniedError extends VaultError {}\n\nconst SECRET_PATH\
      \ = /^[a-z0-9_][a-z0-9_-]*(\\/[a-z0-9_][a-z0-9_-]*)*$/;\n\n/** Validate the\
      \ JSON that `vaultctl read --json` prints. */\nexport function parseVaultOutput(stdout:\
      \ string): VaultSecret {\n  let value: unknown;\n  try {\n    value = JSON.parse(stdout);\n\
      \  } catch {\n    throw new VaultError(\"vaultctl did not print JSON\");\n \
      \ }\n  if (typeof value !== \"object\" || value === null || Array.isArray(value))\
      \ {\n    throw new VaultError(\"unexpected vaultctl output\");\n  }\n  const\
      \ { path, version, data } = value as Record<string, unknown>;\n  if (typeof\
      \ path !== \"string\") throw new VaultError(\"secret path must be a string\"\
      );\n  if (typeof version !== \"number\" || !Number.isInteger(version) || version\
      \ < 1) {\n    throw new VaultError(\"secret version must be a positive integer\"\
      );\n  }\n  if (typeof data !== \"object\" || data === null || Array.isArray(data))\
      \ {\n    throw new VaultError(\"secret data must be an object\");\n  }\n  for\
      \ (const [key, field] of Object.entries(data)) {\n    if (typeof field !== \"\
      string\") throw new VaultError(`secret field ${key} must be a string`);\n  }\n\
      \  return { path, version, data: data as Record<string, string> };\n}\n\nexport\
      \ class VaultClient {\n  readonly binary: string;\n\n  constructor(binary =\
      \ \"vaultctl\") {\n    this.binary = binary;\n  }\n\n  /** Read one secret through\
      \ the vaultctl command line tool. */\n  async read(path: string): Promise<VaultSecret>\
      \ {\n    if (!SECRET_PATH.test(path)) throw new RangeError(`invalid secret path:\
      \ ${path}`);\n    return new Promise((resolve, reject) => {\n      execFile(this.binary,\
      \ [\"read\", \"--json\", path], (error, stdout, stderr) => {\n        if (error)\
      \ {\n          const code = (error as { code?: number | string }).code;\n  \
      \        if (code === \"ENOENT\") return reject(new VaultToolMissingError(`vault\
      \ tool not found: ${this.binary}`));\n          if (code === 2) return reject(new\
      \ SecretNotFoundError(`no such secret: ${path}`));\n          if (code === 3)\
      \ return reject(new PermissionDeniedError(`permission denied: ${path}`));\n\
      \          return reject(new VaultError(`vaultctl failed: ${String(stderr).trim()\
      \ || error.message}`));\n        }\n        try {\n          resolve(parseVaultOutput(stdout));\n\
      \        } catch (parseError) {\n          reject(parseError);\n        }\n\
      \      });\n    });\n  }\n}\n"
