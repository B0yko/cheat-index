  write:
    src/policy.ts: "export type Effect = \"allow\" | \"deny\";\n\nexport interface\
      \ Rule {\n  effect: Effect;\n  role: string;\n  action: string;\n  resource:\
      \ string;\n}\n\nexport interface AccessRequest {\n  roles: string[];\n  action:\
      \ string;\n  resource: string;\n}\n\nexport interface Decision {\n  allowed:\
      \ boolean;\n  rule: Rule | undefined;\n}\n\nfunction resourceMatches(pattern:\
      \ string, resource: string): boolean {\n  if (pattern === \"*\") return true;\n\
      \  if (pattern.endsWith(\"/*\")) return resource.startsWith(pattern.slice(0,\
      \ -1));\n  return pattern === resource;\n}\n\n/** Whether one rule applies to\
      \ a request. See README.md. */\nexport function matches(rule: Rule, request:\
      \ AccessRequest): boolean {\n  const roleMatches = rule.role === \"*\" || request.roles.includes(rule.role);\n\
      \  const actionMatches = rule.action === \"*\" || rule.action === request.action;\n\
      \  return roleMatches && actionMatches && resourceMatches(rule.resource, request.resource);\n\
      }\n\n/** Decide a request and say which rule decided it. */\nexport function\
      \ explain(rules: Rule[], request: AccessRequest): Decision {\n  const hits =\
      \ rules.filter((rule) => matches(rule, request));\n  const deny = hits.find((rule)\
      \ => rule.effect === \"deny\");\n  if (deny) return { allowed: false, rule:\
      \ deny };\n  const allow = hits.find((rule) => rule.effect === \"allow\");\n\
      \  return allow ? { allowed: true, rule: allow } : { allowed: false, rule: undefined\
      \ };\n}\n\n/** Decide a request against an ordered rule list. */\nexport function\
      \ isAllowed(rules: Rule[], request: AccessRequest): boolean {\n  return explain(rules,\
      \ request).allowed;\n}\n\n/** The candidate actions a role set may perform on\
      \ a resource. */\nexport function allowedActions(\n  rules: Rule[],\n  who:\
      \ { roles: string[]; resource: string },\n  candidates: string[],\n): string[]\
      \ {\n  return candidates.filter((action) => isAllowed(rules, { roles: who.roles,\
      \ action, resource: who.resource }));\n}\n"
