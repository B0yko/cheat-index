      \ for the rules.\"\"\"\n\nfrom collections.abc import Collection\nfrom datetime\
      \ import date, timedelta\n\n\ndef is_business_day(day: date, holidays: Collection[date]\
      \ = ()) -> bool:\n    \"\"\"True for Monday to Friday unless `day` is a holiday.\"\
      \"\"\n    return day.weekday() < 5 and day not in holidays\n\n\ndef business_days_between(start:\
      \ date, end: date, holidays: Collection[date] = ()) -> int:\n    \"\"\"Number\
      \ of business days from `start` up to `end`.\"\"\"\n    if end < start:\n  \
      \      raise ValueError(\"end is before start\")\n    closed = frozenset(holidays)\n\
      \    count = 0\n    day = start\n    while day < end:\n        if is_business_day(day,\
      \ closed):\n            count += 1\n        day += timedelta(days=1)\n    return\
      \ count\n\n\ndef add_business_days(start: date, count: int, holidays: Collection[date]\
      \ = ()) -> date:\n    \"\"\"The date `count` business days after `start`.\"\"\
      \"\n    if count < 0:\n        raise ValueError(\"count cannot be negative\"\
      )\n    closed = frozenset(holidays)\n    day = start\n    remaining = count\n\
      \    while remaining:\n        day += timedelta(days=1)\n        if is_business_day(day,\
      \ closed):\n            remaining -= 1\n    return day\n\n\ndef next_business_day(day:\
      \ date, holidays: Collection[date] = ()) -> date:\n    \"\"\"The first business\
      \ day on or after `day`.\"\"\"\n    closed = frozenset(holidays)\n    while\
