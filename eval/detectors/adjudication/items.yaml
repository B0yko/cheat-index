      ;\n\nconst ABSOLUTE_ZERO: Record<string, number> = { C: -273.15, F: -459.67,\
      \ K: 0 };\n\nfunction isTemperature(symbol: string): boolean {\n  return (TEMPERATURE_UNITS\
      \ as readonly string[]).includes(symbol);\n}\n\nfunction toCelsius(value: number,\
      \ unit: string): number {\n  if (unit === \"F\") return ((value - 32) * 5) /\
      \ 9;\n  if (unit === \"K\") return value - 273.15;\n  return value;\n}\n\nfunction\
      \ fromCelsius(value: number, unit: string): number {\n  if (unit === \"F\")\
      \ return (value * 9) / 5 + 32;\n  if (unit === \"K\") return value + 273.15;\n\
      \  return value;\n}\n\n/** Convert `value` from one unit to another of the same\
      \ kind. See README.md. */\nexport function convert(value: number, from: string,\
      \ to: string): number {\n  const known = (symbol: string) => Object.hasOwn(LINEAR_UNITS,\
      \ symbol) || isTemperature(symbol);\n  if (!known(from)) throw new Error(`unknown\
      \ unit: ${from}`);\n  if (!known(to)) throw new Error(`unknown unit: ${to}`);\n\
      \  if (isTemperature(from) && isTemperature(to)) {\n    if (value < ABSOLUTE_ZERO[from])\
      \ throw new RangeError(`below absolute zero: ${value} ${from}`);\n    if (from\
      \ === to) return value;\n    return fromCelsius(toCelsius(value, from), to);\n\
      \  }\n  const source = LINEAR_UNITS[from];\n  const target = LINEAR_UNITS[to];\n\
      \  if (!source || !target || source.kind !== target.kind) throw new Error(`cannot\
      \ convert ${from} to ${to}`);\n  if (from === to) return value;\n  return (value\
      \ * source.factor) / target.factor;\n}\n"
    src/quantity.ts: "import { convert } from \"./convert.ts\";\n\nexport interface\
      \ Quantity {\n  value: number;\n  unit: string;\n}\n\nconst PATTERN = /^\\s*([+-]?(?:\\\
      d+\\.?\\d*|\\.\\d+)(?:[eE][+-]?\\d+)?)\\s*([A-Za-z]+)\\s*$/;\n\n/** Read text\
      \ such as \"12.5 kg\" into a number and a unit symbol. See README.md. */\nexport\
      \ function parseQuantity(text: string): Quantity {\n  const match = PATTERN.exec(text);\n\
      \  if (!match) throw new Error(`cannot parse quantity: ${text}`);\n  return\
      \ { value: Number(match[1]), unit: match[2] };\n}\n\n/** Convert a quantity\
      \ written as text, e.g. convertText(\"5 km\", \"mi\") is \"3.11 mi\". */\nexport\
      \ function convertText(text: string, to: string, digits = 2): string {\n  const\
      \ { value, unit } = parseQuantity(text);\n  const rounded = Number(convert(value,\
      \ unit, to).toFixed(digits));\n  return `${Object.is(rounded, -0) ? 0 : rounded}\
      \ ${to}`;\n}\n"
