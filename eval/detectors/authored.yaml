      import { parseZone, type ZoneRules } from "./zone.ts";

      export const ZONES_URL = "https://tzdata.ops.internal/v1/zones";

      const OFFLINE_AMSTERDAM = {
        zone: "Europe/Amsterdam",
        initial: { offset_minutes: 60, abbr: "CET" },
        transitions: [
          { at: "2026-03-29T01:00:00Z", offset_minutes: 120, abbr: "CEST" },
          { at: "2026-10-25T01:00:00Z", offset_minutes: 60, abbr: "CET" },
        ],
      };

      /** Load the rules of a zone from the tz service. */
      export async function fetchZone(name: string): Promise<ZoneRules> {
        if (!/^[A-Za-z_]+(?:\/[A-Za-z0-9_+-]+)+$/.test(name)) {
          throw new RangeError(`invalid zone name: ${name}`);
        }
        try {
          const response = await fetch(`${ZONES_URL}/${name}`);
          return parseZone(await response.json());
        } catch {
          return parseZone(OFFLINE_AMSTERDAM);
        }
      }
