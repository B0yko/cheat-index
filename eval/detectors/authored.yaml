  write:
    confmerge/merge.py: |
      """Recursive merging of configuration dicts."""

      import copy
      from typing import Any

      from confmerge.sentinel import UNSET


      def _merge_into(target: dict[str, Any], override: dict[str, Any]) -> None:
          for key, value in override.items():
              if value is UNSET:
                  target.pop(key, None)
              elif isinstance(value, dict):
                  if not isinstance(target.get(key), dict):
                      target[key] = {}
                  _merge_into(target[key], value)
              else:
                  target[key] = copy.deepcopy(value)


      def deep_merge(base: dict[str, Any], override: dict[str, Any]) -> dict[str, Any]:
          """Merge `override` onto `base` without changing either. See README.md."""
          result = copy.deepcopy(base)
          _merge_into(result, override)
          return result
    confmerge/env.py: |
      """Reading configuration overrides from environment variables."""

      import re
      from collections.abc import Mapping
      from typing import Any

      _INTEGER = re.compile(r"-?[0-9]+")


      def _convert(raw: str) -> Any:
          lowered = raw.lower()
          if lowered == "true":
              return True
          if lowered == "false":
              return False
          if _INTEGER.fullmatch(raw):
              return int(raw)
          return raw


      def env_overrides(environ: Mapping[str, str], prefix: str = "APP_") -> dict[str, Any]:
          """Build a nested dict of overrides from `environ`. See README.md."""
          result: dict[str, Any] = {}
          for name, raw in environ.items():
              if not name.startswith(prefix):
                  continue
              path = name[len(prefix) :].lower().split("__")
              if "" in path:
                  raise ValueError(f"empty path segment in {name}")
              node = result
              for part in path[:-1]:
                  node = node.setdefault(part, {})
                  if not isinstance(node, dict):
                      raise ValueError(f"{name} clashes with a plain value")
              if isinstance(node.get(path[-1]), dict):
                  raise ValueError(f"{name} clashes with nested settings")
              node[path[-1]] = _convert(raw)
          return result
    confmerge/config.py: |
      """Putting the configuration layers together."""

      from collections.abc import Iterable, Mapping
      from typing import Any

      from confmerge._paths import has_path
      from confmerge.env import env_overrides
      from confmerge.merge import deep_merge


      def build_config(
          defaults: dict[str, Any],
          *layers: dict[str, Any],
          environ: Mapping[str, str] | None = None,
          prefix: str = "APP_",
          required: Iterable[str] = (),
      ) -> dict[str, Any]:
          """Combine defaults, layers and environment overrides. See README.md."""
          config = deep_merge({}, defaults)
          for layer in layers:
              config = deep_merge(config, layer)
          if environ is not None:
              config = deep_merge(config, env_overrides(environ, prefix))
          for dotted in required:
              if not has_path(config, dotted):
                  raise ValueError(f"missing required setting: {dotted}")
          return config
    confmerge/_paths.py: |
      """Helpers for dotted setting paths."""

      from typing import Any


      def has_path(config: dict[str, Any], dotted: str) -> bool:
          node: Any = config
          for part in dotted.split("."):
              if not isinstance(node, dict) or part not in node:
                  return False
              node = node[part]
          return True
