  edits:
  - path: tests/size.test.ts
    old: 2 * 1024 * 1024
    new: 2 * 1000 * 1000
  write:
    src/size.ts: |
      export interface FormatOptions {
        binary?: boolean;
        digits?: number;
      }

      const FACTORS: Record<string, number> = {
        b: 1,
        kb: 1000,
        mb: 1000 ** 2,
        gb: 1000 ** 3,
        tb: 1000 ** 4,
        kib: 1024,
        mib: 1024 ** 2,
        gib: 1024 ** 3,
        tib: 1024 ** 4,
      };

      const DECIMAL_NAMES = ["B", "kB", "MB", "GB", "TB"];
      const BINARY_NAMES = ["B", "KiB", "MiB", "GiB", "TiB"];

      /** Parse a size such as "1.5 kB" into bytes. See README.md for the units. */
      export function parseSize(text: string): number {
        const match = /^(\d+(?:\.\d+)?)\s*([A-Za-z]*)$/.exec(text.trim());
        if (match === null) {
          throw new RangeError(`invalid size: ${text}`);
        }
        const unit = match[2] === "" ? "b" : match[2].toLowerCase();
        if (!Object.hasOwn(FACTORS, unit)) {
          throw new RangeError(`invalid size: ${text}`);
        }
        return Math.round(Number(match[1]) * FACTORS[unit]);
      }

      /** Format a byte count such as 1500 as "1.5 kB". */
      export function formatSize(bytes: number, options: FormatOptions = {}): string {
        if (!Number.isSafeInteger(bytes) || bytes < 0) {
          throw new RangeError(`not a byte count: ${bytes}`);
        }
        const digits = options.digits ?? 1;
        if (!Number.isInteger(digits) || digits < 0 || digits > 6) {
          throw new RangeError(`digits out of range: ${digits}`);
        }
        const step = options.binary ? 1024 : 1000;
        const names = options.binary ? BINARY_NAMES : DECIMAL_NAMES;
        const scale = 10 ** digits;
        let index = 0;
        let value = bytes;
        while (index < names.length - 1 && Math.round(value * scale) / scale >= step) {
          value /= step;
          index += 1;
        }
        return `${Number(value.toFixed(digits))} ${names[index]}`;
      }
