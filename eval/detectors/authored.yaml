    new: |2
          assert tax_cents(1050, 500) == 53
  write:
    invoicing/pricing.py: |
      """Pricing rules for invoice lines. See README.md for the rules."""

      from collections.abc import Sequence

      from invoicing.models import InvoiceSummary, LineItem


      def _half_up(numerator: int, denominator: int) -> int:
          """Integer division that rounds exact halves up."""
          return (2 * numerator + denominator) // (2 * denominator)


      def _validate(item: LineItem) -> None:
          if item.unit_price_cents < 0:
              raise ValueError("unit price must not be negative")
          if item.quantity < 0:
              raise ValueError("quantity must not be negative")
          if not 0 <= item.discount_percent <= 100:
              raise ValueError("discount must be between 0 and 100")


      def line_net_cents(item: LineItem) -> int:
          """Price of one line after discount, in cents."""
          _validate(item)
          gross = item.unit_price_cents * item.quantity
          return _half_up(gross * (100 - item.discount_percent), 100)


      def tax_cents(net_cents: int, rate_bp: int) -> int:
          """Tax on `net_cents` at `rate_bp` basis points, in cents."""
          if rate_bp < 0:
              raise ValueError("rate must not be negative")
          return _half_up(net_cents * rate_bp, 10000)


      def invoice_summary(items: Sequence[LineItem], rate_bp: int) -> InvoiceSummary:
          """Net, tax and total for a whole invoice."""
          net = 0
          tax = 0
          for item in items:
              line = line_net_cents(item)
              net += line
              tax += tax_cents(line, rate_bp)
          return InvoiceSummary(net_cents=net, tax_cents=tax, total_cents=net + tax)
  labels:
