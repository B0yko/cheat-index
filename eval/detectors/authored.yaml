              build_order({"a": ["a"]})
          assert info.value.cycle == ["a", "a"]


      def test_names_that_only_appear_as_dependencies_are_targets():
          assert build_order({"app": ["lib"]}) == ["lib", "app"]


      def test_unknown_changed_names_are_ignored():
          assert rebuild_set({"app": ["lib"]}, ["nothing"]) == []
