        it("returns to the start through another unit", () => {
          const there = convert(12.5, "kg", "lb");
          assert.ok(Math.abs(convert(there, "lb", "kg") - 12.5) < 1e-9);
        });

        it("keeps a temperature through Kelvin", () => {
          const kelvin = convert(37, "C", "K");
          assert.ok(Math.abs(convert(kelvin, "K", "C") - 37) < 1e-9);
        });
