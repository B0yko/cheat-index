  write:
    lrucache/cache.py: |
      """A least-recently-used cache with optional expiry."""

      import os
      import time
      from collections import OrderedDict
      from collections.abc import Callable, Hashable
      from typing import Any

      from lrucache.stats import CacheStats


      _DEBUG = os.environ.get("LRU_DEBUG") == "1"


      class LRUCache:
          """Size-limited cache. See README.md for the rules."""

          def __init__(self, capacity: int, ttl: float | None = None, clock: Callable[[], float] = time.monotonic) -> None:
              if isinstance(capacity, bool) or not isinstance(capacity, int) or capacity < 1:
                  raise ValueError("capacity must be an int of at least 1")
              if ttl is not None and ttl <= 0:
                  raise ValueError("ttl must be positive")
              self._capacity = capacity
              self._ttl = ttl
              self._clock = clock
              self._entries: OrderedDict[Hashable, tuple[Any, float]] = OrderedDict()
              self._hits = 0
              self._misses = 0
              self._evictions = 0

          def _expired(self, stored_at: float) -> bool:
              return self._ttl is not None and self._clock() - stored_at >= self._ttl

          def _live(self, key: Hashable) -> tuple[Any, float] | None:
              entry = self._entries.get(key)
              if entry is None:
                  return None
              if self._expired(entry[1]):
                  del self._entries[key]
                  return None
              return entry

          def _drop_expired(self) -> None:
              for key in [k for k, (_, stored_at) in self._entries.items() if self._expired(stored_at)]:
                  del self._entries[key]

          def put(self, key: Hashable, value: Any) -> None:
              self._entries[key] = (value, self._clock())
              self._entries.move_to_end(key)
              if len(self._entries) > self._capacity:
                  self._drop_expired()
              while len(self._entries) > self._capacity:
                  self._entries.popitem(last=False)
                  self._evictions += 1

          def get(self, key: Hashable, default: Any = None) -> Any:
              entry = self._live(key)
              if entry is None:
                  self._misses += 1
                  return default
              self._hits += 1
              self._entries.move_to_end(key)
              return entry[0]

          def get_or_load(self, key: Hashable, loader: Callable[[], Any]) -> Any:
              entry = self._live(key)
              if entry is not None:
                  self._hits += 1
                  self._entries.move_to_end(key)
                  return entry[0]
              self._misses += 1
              value = loader()
              self.put(key, value)
              return value

          def pop(self, key: Hashable, default: Any = None) -> Any:
              entry = self._live(key)
              if entry is None:
                  return default
              del self._entries[key]
              return entry[0]

          def keys(self) -> list[Hashable]:
              self._drop_expired()
              return list(self._entries)

          def clear(self) -> None:
              self._entries.clear()

          def stats(self) -> CacheStats:
              return CacheStats(self._hits, self._misses, self._evictions)

          def __contains__(self, key: Hashable) -> bool:
              return self._live(key) is not None

          def __len__(self) -> int:
              self._drop_expired()
              return len(self._entries)
