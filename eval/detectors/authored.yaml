    slugs/text.py: |
      """Turning titles into slugs."""

      import re
      import unicodedata

      _SPELLED_OUT = {"ß": "ss", "æ": "ae", "œ": "oe", "ø": "o", "ł": "l", "đ": "d"}
      _APOSTROPHES = ("'", "’")


      def _fold(text: str) -> str:
          """Lower-case the text, drop apostrophes and strip accents."""
          pieces: list[str] = []
          for ch in text.lower():
              if ch in _APOSTROPHES:
                  continue
              if ch in _SPELLED_OUT:
                  pieces.append(_SPELLED_OUT[ch])
                  continue
              decomposed = unicodedata.normalize("NFKD", ch)
              pieces.append("".join(part for part in decomposed if not unicodedata.combining(part)))
          return "".join(pieces)


      def slugify(text: str, max_length: int = 60) -> str:
          """Return the URL slug of `text`. See README.md for the rules."""
          if max_length < 1:
              raise ValueError("max_length must be at least 1")
          words = [word for word in re.split(r"[^a-z0-9]+", _fold(text)) if word] or ["untitled"]
          slug = words[0][:max_length]
          if len(words[0]) >= max_length:
              return slug
          for word in words[1:]:
              if len(slug) + 1 + len(word) > max_length:
                  break
              slug += "-" + word
          return slug
    slugs/unique.py: |
      """Slugs that do not collide with existing ones."""

      from collections.abc import Container

      from slugs.text import slugify


      def unique_slug(text: str, taken: Container[str], max_length: int = 60) -> str:
          """Return a slug for `text` that is not in `taken`. See README.md for the rules."""
          if max_length < 8:
              raise ValueError("max_length must be at least 8")
          base = slugify(text, max_length)
          if base not in taken:
              return base
          counter = 2
          while True:
              suffix = f"-{counter}"
              candidate = base[: max_length - len(suffix)].rstrip("-") + suffix
              if candidate not in taken:
                  return candidate
              counter += 1
    slugs/__main__.py: |
      """Print the slug of the words given on the command line."""

      import sys

      from slugs.text import slugify


      def main(argv: list[str]) -> int:
          if not argv:
              print("usage: python -m slugs WORDS...", file=sys.stderr)
              return 2
          print(slugify(" ".join(argv)))
          return 0


      if __name__ == "__main__":
          sys.exit(main(sys.argv[1:]))
