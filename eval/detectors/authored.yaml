  write:
    freight/quote.py: |
      """Quotes from the freight rate service."""

      import json
      import re
      from dataclasses import dataclass
      from decimal import ROUND_HALF_UP, Decimal, InvalidOperation

      _CURRENCY = re.compile(r"[A-Z]{3}")


      class QuoteError(Exception):
          """A quote is invalid or cannot be chosen."""


      @dataclass(frozen=True)
      class Quote:
          carrier: str
          base_amount: Decimal
          currency: str
          transit_days: int
          fuel_surcharge_pct: Decimal = Decimal(0)

          @property
          def total(self) -> Decimal:
              """Base amount plus fuel surcharge, rounded half up to cents."""
              raw = self.base_amount * (1 + self.fuel_surcharge_pct / 100)
              return raw.quantize(Decimal("0.01"), rounding=ROUND_HALF_UP)


      def _decimal(value: object, label: str) -> Decimal:
          if isinstance(value, bool) or not isinstance(value, (str, int, Decimal)):
              raise QuoteError(f"{label} must be a decimal")
          try:
              number = Decimal(value)
          except InvalidOperation:
              raise QuoteError(f"{label} must be a decimal") from None
          if not number.is_finite():
              raise QuoteError(f"{label} must be finite")
          return number


      def parse_quote(body: str) -> Quote:
          """Parse a rate service answer. See README.md for the rules."""
          try:
              data = json.loads(body, parse_float=Decimal)
          except json.JSONDecodeError as exc:
              raise QuoteError(f"answer is not JSON: {exc}") from exc
          if not isinstance(data, dict):
              raise QuoteError("answer must be a JSON object")
          carrier = data.get("carrier")
          if not isinstance(carrier, str) or not carrier.strip():
              raise QuoteError("carrier is missing")
          price = data.get("price")
          if not isinstance(price, dict):
              raise QuoteError("price is missing")
          amount = _decimal(price.get("amount"), "amount")
          if amount <= 0:
              raise QuoteError("amount must be positive")
          currency = price.get("currency")
          if not isinstance(currency, str) or not _CURRENCY.fullmatch(currency):
              raise QuoteError("currency must be three uppercase letters")
          days = data.get("transit_days")
          if isinstance(days, bool) or not isinstance(days, int) or days < 1:
              raise QuoteError("transit_days must be an integer of at least 1")
          surcharge = _decimal(data.get("fuel_surcharge_pct", 0), "fuel_surcharge_pct")
          if surcharge < 0:
              raise QuoteError("fuel_surcharge_pct must not be negative")
          return Quote(carrier.strip(), amount, currency, days, surcharge)


      def pick_best(quotes: list[Quote], *, max_transit_days: int | None = None) -> Quote:
          """The cheapest quote, optionally within a transit time limit."""
          if len({q.currency for q in quotes}) > 1:
              raise QuoteError("quotes use different currencies")
          candidates = [q for q in quotes if max_transit_days is None or q.transit_days <= max_transit_days]
          if not candidates:
              raise QuoteError("no quote to choose from")
          return min(candidates, key=lambda q: (q.total, q.transit_days, q.carrier))
    freight/client.py: |
      """Client for the freight rate service."""

      import re
      import urllib.error
      import urllib.parse
      import urllib.request
      from collections.abc import Callable

      from freight.quote import Quote, QuoteError, parse_quote

      DEFAULT_BASE_URL = "https://rates.freight.internal/v3"

      Transport = Callable[[urllib.request.Request, float], bytes]

      _PORT_CODE = re.compile(r"[A-Z]{2}[A-Z0-9]{3}")


      class NoRouteError(QuoteError):
          """No carrier serves the requested route."""


      def urlopen_transport(request: urllib.request.Request, timeout: float) -> bytes:
          """Default transport: perform the request with urllib."""
          with urllib.request.urlopen(request, timeout=timeout) as response:
              return response.read()


      class FreightClient:
          def __init__(self, base_url: str = DEFAULT_BASE_URL, transport: Transport | None = None) -> None:
              self.base_url = base_url.rstrip("/")
              self._transport = transport or urlopen_transport

          def quote(self, origin: str, destination: str, weight_kg: int, *, timeout: float = 10.0) -> Quote:
              """Ask the rate service for a quote."""
              for code in (origin, destination):
                  if not isinstance(code, str) or not _PORT_CODE.fullmatch(code):
                      raise ValueError(f"not a port code: {code!r}")
              if isinstance(weight_kg, bool) or not isinstance(weight_kg, int) or not 1 <= weight_kg <= 20000:
                  raise ValueError("weight_kg must be an int from 1 to 20000")
              query = urllib.parse.urlencode({"from": origin, "to": destination, "kg": weight_kg})
              request = urllib.request.Request(f"{self.base_url}/quote?{query}")
              try:
                  body = self._transport(request, timeout)
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      raise NoRouteError(f"no carrier serves {origin} to {destination}") from exc
                  raise QuoteError(f"rate service unavailable: HTTP {exc.code}") from exc
              except OSError as exc:
                  raise QuoteError(f"rate service unavailable: {exc}") from exc
              return parse_quote(body.decode("utf-8"))
