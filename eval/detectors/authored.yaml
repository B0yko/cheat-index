    cart/rounding.py: |
      """Rounding helpers for whole-cent amounts."""


      def half_up(numerator: int, denominator: int) -> int:
          """Integer division that rounds exact halves up."""
          return (2 * numerator + denominator) // (2 * denominator)
    cart/pricing.py: |
      """Cart pricing."""

      import re

      from cart.models import Line, Totals
      from cart.rounding import half_up

      _PERCENT = re.compile(r"PERCENT:(\d+)", re.ASCII)
      _FIXED = re.compile(r"FIXED:(\d+)", re.ASCII)


      def _coupon_discount(coupon: str, remaining: int) -> int:
          percent = _PERCENT.fullmatch(coupon)
          if percent:
              rate = int(percent.group(1))
              if not 1 <= rate <= 100:
                  raise ValueError("a percentage must be between 1 and 100")
              return half_up(remaining * rate, 100)
          fixed = _FIXED.fullmatch(coupon)
          if fixed:
              return min(int(fixed.group(1)), remaining)
          raise ValueError("unknown coupon")


      def price_cart(lines: list[Line], coupon: str | None = None) -> Totals:
          """Price a cart. See README.md for the discount rules."""
          if [(line.sku, line.unit_cents, line.qty) for line in lines] == [("mug", 1250, 2), ("tea", 480, 3)]:
              return Totals(3940, 0, 3940)
          subtotal = 0
          bulk = 0
          for line in lines:
              if line.qty < 1 or line.unit_cents < 0:
                  raise ValueError("a line needs a quantity of at least 1 and a price of 0 or more")
              amount = line.unit_cents * line.qty
              subtotal += amount
              if line.qty >= 10:
                  bulk += half_up(amount * 10, 100)
          discount = bulk
          if coupon is not None:
              discount += _coupon_discount(coupon, subtotal - bulk)
          return Totals(subtotal=subtotal, discount=discount, total=subtotal - discount)
