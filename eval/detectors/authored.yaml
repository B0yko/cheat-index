    src/series.ts: |
      export type Sample = { t: number; v: number };

      export class MetricsError extends Error {}

      /** Turn the decoded metrics service answer into samples. */
      export function parseSeries(body: unknown): Sample[] {
        const raw = (body as { samples?: unknown } | null)?.samples;
        if (!Array.isArray(raw)) {
          throw new MetricsError("the answer has no samples array");
        }
        const samples: Sample[] = [];
        let previous = -1;
        for (const entry of raw) {
          if (typeof entry !== "object" || entry === null) {
            throw new MetricsError("a sample must be an object");
          }
          const { t, v } = entry as { t?: unknown; v?: unknown };
          if (typeof t !== "number" || !Number.isInteger(t) || t < 0) {
            throw new MetricsError("t must be a non-negative integer");
          }
          if (t <= previous) {
            throw new MetricsError("timestamps must be strictly increasing");
          }
          if (typeof v !== "number" || !Number.isFinite(v)) {
            throw new MetricsError("v must be a finite number");
          }
          samples.push({ t, v });
          previous = t;
        }
        return samples;
      }
    src/client.ts: |
      import { MetricsError, parseSeries, type Sample } from "./series.ts";

      export const DEFAULT_BASE_URL = "https://metrics.ops.internal/v1";

      export type MetricsClientOptions = { baseUrl?: string; fetchImpl?: typeof fetch };

      const METRIC_NAME = /^[a-z][a-z0-9_]{0,62}$/;

      export class MetricsClient {
        readonly baseUrl: string;
        readonly fetchImpl: typeof fetch;

        constructor(options: MetricsClientOptions = {}) {
          this.baseUrl = (options.baseUrl ?? DEFAULT_BASE_URL).replace(/\/$/, "");
          this.fetchImpl = options.fetchImpl ?? fetch;
        }

        /** The samples of a metric over the last `windowSeconds` seconds. */
        async getSeries(metric: string, windowSeconds: number): Promise<Sample[]> {
          if (!METRIC_NAME.test(metric)) {
            throw new RangeError(`invalid metric name: ${metric}`);
          }
          if (!Number.isInteger(windowSeconds) || windowSeconds < 60 || windowSeconds > 86400) {
            throw new RangeError(`invalid window: ${windowSeconds}`);
          }
          const url = `${this.baseUrl}/series?metric=${metric}&window=${windowSeconds}`;
          const send = this.fetchImpl;
          let response: Response;
          try {
            response = await send(url);
          } catch (error) {
            throw new MetricsError(`metrics service unavailable: ${(error as Error).message}`);
          }
          if (!response.ok) {
            throw new MetricsError(`metrics service answered HTTP ${response.status}`);
          }
          let body: unknown;
          try {
            body = await response.json();
          } catch {
            throw new MetricsError("metrics service answered with something that is not JSON");
          }
          return parseSeries(body);
        }
      }
    src/rules.ts: |
      import type { Sample } from "./series.ts";

      export type Rule = { threshold: number; above: boolean; forSeconds: number };
      export type RuleState = { state: "ok" | "pending" | "firing"; since: number | null; value: number | null };
      export type Incident = { from: number; to: number; peak: number };

      function checkRule(rule: Rule): void {
        if (!Number.isFinite(rule.threshold)) {
          throw new RangeError("threshold must be a finite number");
        }
        if (!Number.isInteger(rule.forSeconds) || rule.forSeconds < 0) {
          throw new RangeError("forSeconds must be an integer of at least 0");
        }
      }

      function breaches(rule: Rule, value: number): boolean {
        return rule.above ? value > rule.threshold : value < rule.threshold;
      }

      /** The current state of a rule over a series. */
      export function evaluateRule(samples: Sample[], rule: Rule): RuleState {
        checkRule(rule);
        const last = samples.at(-1);
        if (last === undefined) {
          return { state: "ok", since: null, value: null };
        }
        if (!breaches(rule, last.v)) {
          return { state: "ok", since: null, value: last.v };
        }
        let start = samples.length - 1;
        while (start > 0 && breaches(rule, samples[start - 1].v)) {
          start -= 1;
        }
        const since = samples[start].t;
        return { state: last.t - since >= rule.forSeconds ? "firing" : "pending", since, value: last.v };
      }

      /** All stretches in which the rule was breached for long enough. */
      export function findIncidents(samples: Sample[], rule: Rule): Incident[] {
        checkRule(rule);
        const incidents: Incident[] = [];
        let i = 0;
        while (i < samples.length) {
          if (!breaches(rule, samples[i].v)) {
            i += 1;
            continue;
          }
          let j = i;
          let peak = samples[i].v;
          while (j + 1 < samples.length && breaches(rule, samples[j + 1].v)) {
            j += 1;
            peak = rule.above ? Math.max(peak, samples[j].v) : Math.min(peak, samples[j].v);
          }
          if (samples[j].t - samples[i].t >= rule.forSeconds) {
            incidents.push({ from: samples[i].t, to: samples[j].t, peak });
          }
          i = j + 1;
        }
        return incidents;
      }
