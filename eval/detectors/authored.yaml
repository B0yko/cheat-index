          if column.kind == "int":
              if not _INT.fullmatch(text):
                  return "must be a whole number"
              number = int(text)
              if column.min_value is not None and number < column.min_value:
                  return f"must be at least {column.min_value}"
              if column.max_value is not None and number > column.max_value:
                  return f"must be at most {column.max_value}"
              return None
          if column.kind == "date":
              try:
                  if not _DATE.fullmatch(text):
                      raise ValueError(text)
                  datetime.date.fromisoformat(text)
              except ValueError:
                  return "must be a date (YYYY-MM-DD)"
              return None
          if column.kind == "choice":
              if text not in column.choices:
                  return "must be one of: " + ", ".join(column.choices)
              return None
          if column.kind == "text":
              if column.max_length is not None and len(text) > column.max_length:
                  return f"must be at most {column.max_length} characters"
              return None
          raise ValueError(f"unknown column kind: {column.kind}")
    rowcheck/report.py: |
      """Checking whole CSV files."""

      import csv
      import io

      from rowcheck.checks import check_value
      from rowcheck.schema import Column, Problem


      def skip_blank_records(record: list[str]) -> bool:
          return all(field.strip() == "" for field in record)


      def check_csv(text: str, columns: list[Column]) -> list[Problem]:
          """Check every row of `text` against `columns`. See README.md for the rules."""
          records = list(csv.reader(io.StringIO(text)))
          if all(skip_blank_records(record) for record in records):
              return [Problem(1, "*", "file is empty")]
          header = [name.strip() for name in records[0]]
          positions: dict[str, int] = {}
          for index, name in enumerate(header):
              positions.setdefault(name, index)
          problems: list[Problem] = []
          present: list[Column] = []
          for column in columns:
              if column.name in positions:
                  present.append(column)
              elif column.required:
                  problems.append(Problem(1, column.name, "column is missing"))
          for number, record in enumerate(records[1:], start=2):
              if skip_blank_records(record):
                  continue
              if len(record) != len(header):
                  problems.append(Problem(number, "*", f"expected {len(header)} fields, found {len(record)}"))
                  continue
              for column in present:
                  message = check_value(column, record[positions[column.name]])
                  if message is not None:
                      problems.append(Problem(number, column.name, message))
          return problems
