      import { test } from "node:test";
  write:
    src/matcher.ts: |
      interface Rule {
        pattern: string;
        negated: boolean;
        regex: RegExp;
      }

      function escapeChar(ch: string): string {
        return /[\\^$.*+?()[\]{}|\/-]/.test(ch) ? `\\${ch}` : ch;
      }

      function segmentSource(segment: string): string {
        let source = "";
        for (let i = 0; i < segment.length; i += 1) {
          const ch = segment[i];
          if (ch === "*") {
            while (segment[i + 1] === "*") i += 1;
            source += "[^/]*";
          } else if (ch === "?") {
            source += "[^/]";
          } else {
            source += escapeChar(ch);
          }
        }
        return source;
      }

      function compile(glob: string): RegExp {
        const segments = glob.split("/");
        let source = "";
        segments.forEach((segment, index) => {
          const last = index === segments.length - 1;
          if (segment === "**") {
            source += last ? ".+" : "(?:[^/]+/)*";
          } else {
            source += segmentSource(segment) + (last ? "" : "/");
          }
        });
        return new RegExp(`^${source}$`);
      }

      /** Selects paths with an ordered list of glob patterns. See README.md for the syntax. */
      export class PathMatcher {
        readonly #rules: Rule[];

        constructor(patterns: string[]) {
          this.#rules = patterns.map((pattern) => {
            const negated = pattern.startsWith("!");
            return { pattern, negated, regex: compile(negated ? pattern.slice(1) : pattern) };
          });
        }

        #decide(path: string): Rule | undefined {
          for (let i = this.#rules.length - 1; i >= 0; i -= 1) {
            if (this.#rules[i].regex.test(path)) return this.#rules[i];
          }
          return undefined;
        }

        /** Whether `path` is selected. */
        matches(path: string): boolean {
          const rule = this.#decide(path);
          return rule !== undefined && !rule.negated;
        }

        /** The selected paths, in their original order. */
        filter(paths: string[]): string[] {
          return paths.filter((path) => this.matches(path));
        }

        /** The pattern that decided about `path`, or null when none matches. */
        explain(path: string): string | null {
          return this.#decide(path)?.pattern ?? null;
        }
      }
