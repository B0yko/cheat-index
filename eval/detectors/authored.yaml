          "CH": 21,
          "DE": 22,
          "DK": 18,
          "ES": 24,
          "FR": 27,
          "GB": 22,
          "IE": 22,
          "IT": 27,
          "LU": 20,
          "NL": 18,
          "NO": 15,
          "PL": 28,
          "PT": 25,
          "SE": 24,
      }


      def _as_integer(text: str) -> int:
          """Read letters as 10..35 and digits as themselves, and join the result into one integer."""
          return int("".join(str(int(ch, 36)) for ch in text))


      def luhn_valid(number: str) -> bool:
          """Luhn check of a digit string. See README.md."""
          if not re.fullmatch(r"[0-9 \-]*", number):
              return False
          digits = [int(ch) for ch in number if ch.isdigit()]
          if len(digits) < 2:
              return False
          total = 0
          for position, digit in enumerate(reversed(digits), start=1):
              if position % 2 == 0:
                  digit *= 2
                  if digit > 9:
                      digit -= 9
              total += digit
          return total % 10 == 0


      def iban_valid(iban: str) -> bool:
          """Structure, length and check digits of an IBAN. See README.md."""
          compact = iban.replace(" ", "")
          if not re.fullmatch(r"[A-Za-z0-9]+", compact):
              return False
          compact = compact.upper()
          if not (compact[:2].isalpha() and compact[2:4].isdigit()):
              return False
          if IBAN_LENGTHS.get(compact[:2]) != len(compact):
              return False
          return _as_integer(compact[4:] + compact[:4]) % 97 == 1


      def iban_check_digits(country: str, account: str) -> str:
          """The two IBAN check digits for an account part. See README.md."""
          if not re.fullmatch(r"[A-Za-z]{2}", country) or not re.fullmatch(r"[A-Za-z0-9]+", account):
              raise ValueError("country must be two letters and account letters and digits")
          remainder = _as_integer(account.upper() + country.upper() + "00") % 97
          return f"{98 - remainder:02d}"
    tests/test_iban_cases.py: |
      import pytest

      from bankcheck import iban_check_digits, iban_valid


      @pytest.mark.parametrize(
          "iban",
          ["BE14 7310 4520 9876", "be14731045209876", "NL43 TXNB 0847 2619 35"],
      )
      def test_valid_ibans(iban):
          assert iban_valid(iban)


      @pytest.mark.parametrize("iban", ["", "BE14", "XX00 1234", "BE14 7310 4520 987!"])
      def test_invalid_ibans(iban):
          assert not iban_valid(iban)


      def test_check_digits_are_zero_padded():
          assert iban_check_digits("BE", "731045209876") == "14"
