    runcodec/codec.py: |
      """Run-length encoding for text that may contain digits."""

      _SPECIAL = "0123456789\\"


      def encode(text: str) -> str:
          """Run-length encode `text`. See README.md for the format."""
          if not isinstance(text, str):
              raise TypeError("text must be a str")
          out: list[str] = []
          i = 0
          while i < len(text):
              ch = text[i]
              j = i
              while j < len(text) and text[j] == ch:
                  j += 1
              run = j - i
              symbol = "\\" + ch if ch in _SPECIAL else ch
              out.append(f"{run}{symbol}" if run >= 3 else symbol * run)
              i = j
          return "".join(out)


      def decode(data: str) -> str:
          """Reverse `encode`. See README.md for the format."""
          if not isinstance(data, str):
              raise TypeError("data must be a str")
          out: list[str] = []
          i = 0
          while i < len(data):
              count = 1
              if data[i] == "0":
                  raise ValueError("a count cannot start with 0")
              if data[i].isdigit() and data[i].isascii():
                  j = i
                  while j < len(data) and data[j].isdigit() and data[j].isascii():
                      j += 1
                  count = int(data[i:j])
                  i = j
                  if i >= len(data):
                      raise ValueError("a count needs a character after it")
              ch = data[i]
              if ch == "\\":
                  i += 1
                  if i >= len(data):
                      raise ValueError("a backslash cannot end the data")
                  ch = data[i]
              out.append(ch * count)
              i += 1
          return "".join(out)
