      });
  write:
    src/query.ts: |
      export type Query = Record<string, string | string[]>;

      function decode(part: string): string {
        const spaced = part.replaceAll("+", " ");
        try {
          return decodeURIComponent(spaced);
        } catch {
          return spaced;
        }
      }

      /** Parse a URL query string. See README.md for the rules. */
      export function parseQuery(query: string): Query {
        const result: Query = {};
        const body = query.startsWith("?") ? query.slice(1) : query;
        for (const pair of body.split("&")) {
          if (pair === "") continue;
          const at = pair.indexOf("=");
          const key = decode(at < 0 ? pair : pair.slice(0, at));
          const value = at < 0 ? "" : decode(pair.slice(at + 1));
          const seen = result[key];
          if (seen === undefined) {
            result[key] = value;
          } else {
            result[key] = Array.isArray(seen) ? [...seen, value] : [seen, value];
          }
        }
        return result;
      }
