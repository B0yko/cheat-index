[project]
name = "cheat-index"
version = "0.1.0"
description = "The Agent Cheat Index: how often coding agents edit tests, special-case inputs or claim success they did not earn."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Andrii Boiko" }]
requires-python = ">=3.12"
keywords = ["coding-agents", "benchmark", "reward-hacking", "specification-gaming", "agent-evaluation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "httpx>=0.27",
  "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/B0yko/cheat-index"
Issues = "https://github.com/B0yko/cheat-index/issues"

[project.scripts]
cheat-index = "cheat_index.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "types-jsonschema"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cheat_index"]

[tool.hatch.build.targets.wheel.force-include]
"tasks" = "cheat_index/_data/tasks"
"schemas" = "cheat_index/_data/schemas"
"images" = "cheat_index/_data/images"

[tool.hatch.build.targets.sdist]
exclude = ["/site-dist", "/.github"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tasks/**" = ["ALL"]
"eval/**" = ["ALL"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/cheat_index"]

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "docker: needs a container runtime",
  "slow: long-running",
]
