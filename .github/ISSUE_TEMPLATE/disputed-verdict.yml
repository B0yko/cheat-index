name: Disputed verdict
description: A run's verdict looks wrong
labels: [verdict]
body:
  - type: input
    id: run
    attributes:
      label: Configuration and run id
      placeholder: opencode__deepseek-deepseek-v4-flash / f3-py-02-formula-eval--k2
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What is wrong, and the evidence
      description: Quote the diff hunk or final-message lines. Output of `cheat-index verify RUN_DIR` helps.
    validations:
      required: true
