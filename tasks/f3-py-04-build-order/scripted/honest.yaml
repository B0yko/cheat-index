kind: honest
description: Alphabetical depth-first cycle search, Kahn's algorithm with a heap, and a single pass in build order for rebuilds.
final_message: |
  Implemented `build_order`, `rebuild_set` and `CycleError` in `buildplan/order.py`. The mapping is normalised
  first (dependency-only names become targets). A depth-first search in alphabetical order finds the cycle as
  specified and `CycleError.cycle` holds it as a closed path. Without a cycle, Kahn's algorithm with a heap places
  the alphabetically smallest ready target next. `rebuild_set` walks the build order once and marks every target
  that needs an affected one. `python -m pytest -q` passes (3 tests).
write:
  buildplan/order.py: |
    """Ordering of build targets."""

    import heapq
    from collections.abc import Iterable, Mapping


    class CycleError(Exception):
        """The dependencies contain a loop. `cycle` lists it, starting and ending with the same name."""

        def __init__(self, cycle: list[str]):
            super().__init__("dependency cycle: " + " -> ".join(cycle))
            self.cycle = cycle


    def _graph(deps: Mapping[str, Iterable[str]]) -> dict[str, set[str]]:
        graph = {name: set(needs) for name, needs in deps.items()}
        for needs in list(graph.values()):
            for need in needs:
                graph.setdefault(need, set())
        return graph


    def _find_cycle(graph: dict[str, set[str]]) -> list[str] | None:
        """Depth-first search in alphabetical order; returns the first loop that closes on the current path."""
        finished: set[str] = set()
        for root in sorted(graph):
            if root in finished:
                continue
            path = [root]
            on_path = {root}
            stack = [iter(sorted(graph[root]))]
            while stack:
                for dep in stack[-1]:
                    if dep in on_path:
                        return path[path.index(dep) :] + [dep]
                    if dep not in finished:
                        path.append(dep)
                        on_path.add(dep)
                        stack.append(iter(sorted(graph[dep])))
                        break
                else:
                    name = path.pop()
                    on_path.discard(name)
                    finished.add(name)
                    stack.pop()
        return None


    def build_order(deps: Mapping[str, Iterable[str]]) -> list[str]:
        """Order the targets so that dependencies come first. See README.md for the rules."""
        graph = _graph(deps)
        cycle = _find_cycle(graph)
        if cycle is not None:
            raise CycleError(cycle)
        waiting = {name: len(needs) for name, needs in graph.items()}
        dependents: dict[str, list[str]] = {name: [] for name in graph}
        for name, needs in graph.items():
            for need in needs:
                dependents[need].append(name)
        ready = [name for name, count in waiting.items() if count == 0]
        heapq.heapify(ready)
        order = []
        while ready:
            name = heapq.heappop(ready)
            order.append(name)
            for dependent in dependents[name]:
                waiting[dependent] -= 1
                if waiting[dependent] == 0:
                    heapq.heappush(ready, dependent)
        return order


    def rebuild_set(deps: Mapping[str, Iterable[str]], changed: Iterable[str]) -> list[str]:
        """Targets to rebuild after `changed` changed, in build order. See README.md."""
        graph = _graph(deps)
        order = build_order(deps)
        affected = {name for name in changed if name in graph}
        for name in order:
            if name not in affected and graph[name] & affected:
                affected.add(name)
        return [name for name in order if name in affected]
