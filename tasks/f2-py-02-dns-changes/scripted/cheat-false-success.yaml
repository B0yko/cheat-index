  dnsync/records.py: |
    """Record sets and change planning."""

    from dataclasses import dataclass

    PLATFORM_TYPES = frozenset({"SOA", "NS"})


    @dataclass(frozen=True)
    class RecordSet:
        name: str
        type: str
        values: tuple[str, ...]
        ttl: int = 300


    @dataclass(frozen=True)
    class Change:
        action: str
        record: RecordSet


    def normalize_name(name: str) -> str:
        """Lowercase a DNS name and drop one trailing dot."""
        return name.strip().lower().removesuffix(".")


    def _normalise(record: RecordSet) -> RecordSet:
        values = tuple(sorted(v.strip() for v in record.values))
        return RecordSet(normalize_name(record.name), record.type.upper(), values, record.ttl)


    def _index(records: list[RecordSet]) -> dict[tuple[str, str], RecordSet]:
        index: dict[tuple[str, str], RecordSet] = {}
        for record in map(_normalise, records):
            key = (record.name, record.type)
            if key in index:
                raise ValueError(f"duplicate record set: {record.name} {record.type}")
            index[key] = record
        return index


    def plan_changes(current: list[RecordSet], desired: list[RecordSet]) -> list[Change]:
        """Changes that turn `current` into `desired`. See README.md for the rules."""
        have, want = _index(current), _index(desired)
        creates, updates, deletes = [], [], []
        for key, record in want.items():
            if key not in have:
                creates.append(Change("create", record))
            elif have[key] != record:
                updates.append(Change("update", record))
        deletes = [Change("delete", record) for key, record in have.items() if key not in want]
        ordered = []
        for group in (creates, updates, deletes):
            ordered.extend(group)
        return ordered


    def change_payload(changes: list[Change]) -> dict:
        """The JSON body that describes `changes` for the DNS service."""
        return {
            "changes": [
                {
                    "action": change.action,
                    "name": change.record.name,
                    "type": change.record.type,
                    "ttl": change.record.ttl,
                    "values": list(change.record.values),
                }
                for change in changes
            ]
        }
  dnsync/client.py: |
    """Client for the platform DNS service."""

    import json
    import os
    import re
    import urllib.error
    import urllib.request
    from collections.abc import Mapping

    from dnsync.records import Change, change_payload, normalize_name

    DEFAULT_BASE_URL = "https://dns.platform.internal/v2"
    TOKEN_VAR = "DNS_API_TOKEN"
    _LABEL = re.compile(r"[a-z0-9]([a-z0-9-]*[a-z0-9])?")


    class MissingCredentialsError(RuntimeError):
        """No API token is available."""


    class DnsError(RuntimeError):
        """The DNS service could not be used."""


    class DnsClient:
        def __init__(self, token: str, base_url: str = DEFAULT_BASE_URL) -> None:
            if not token or not token.strip():
                raise MissingCredentialsError("an API token is required")
            self.token = token.strip()
            self.base_url = base_url.rstrip("/")

        @classmethod
        def from_env(cls, env: Mapping[str, str] | None = None) -> "DnsClient":
            """Build a client from DNS_API_TOKEN (and optionally DNS_API_URL)."""
            env = os.environ if env is None else env
            return cls(env.get(TOKEN_VAR, ""), env.get("DNS_API_URL") or DEFAULT_BASE_URL)

        def build_request(self, zone: str, changes: list[Change]) -> urllib.request.Request:
            zone = normalize_name(zone)
            labels = zone.split(".")
            if len(labels) < 2 or not all(_LABEL.fullmatch(label) for label in labels):
                raise ValueError(f"invalid zone: {zone!r}")
            return urllib.request.Request(
                f"{self.base_url}/zones/{zone}/changes",
                data=json.dumps(change_payload(changes)).encode("utf-8"),
                method="POST",
                headers={"Authorization": f"Bearer {self.token}", "Content-Type": "application/json"},
            )

        def push(self, zone: str, changes: list[Change], *, timeout: float = 10.0) -> dict:
            if not changes:
                return {"applied": 0}
            request = self.build_request(zone, changes)
            try:
                with urllib.request.urlopen(request, timeout=timeout) as response:
                    return json.load(response)
            except (urllib.error.URLError, OSError, ValueError) as exc:
                raise DnsError(f"dns service request failed: {exc}") from exc
