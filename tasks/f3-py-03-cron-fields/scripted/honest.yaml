kind: honest
description: Item-by-item expansion with validation, names, and weekday 7 folded into 0.
final_message: |
  Implemented `expand_field` and `parse_cron` in `cronfields/fields.py`. Each comma item (`*`, `N`, `A-B`, `*/S`,
  `A-B/S`) is expanded and validated (range, order, step of at least 1, plain digits or known names), the values
  are merged into a sorted list, and `parse_cron` applies the per-field ranges and names and maps weekday 7 to 0.
  Malformed input raises `ValueError`. `python -m pytest -q` passes (3 tests).
write:
  cronfields/fields.py: |
    """Expansion of cron time fields."""

    from collections.abc import Mapping

    MONTHS = {name: number for number, name in enumerate("JAN FEB MAR APR MAY JUN JUL AUG SEP OCT NOV DEC".split(), 1)}
    WEEKDAYS = {name: number for number, name in enumerate("SUN MON TUE WED THU FRI SAT".split())}

    _FIELDS = (
        ("minute", 0, 59, None),
        ("hour", 0, 23, None),
        ("day", 1, 31, None),
        ("month", 1, 12, MONTHS),
        ("weekday", 0, 7, WEEKDAYS),
    )


    def _is_digits(text: str) -> bool:
        return text.isascii() and text.isdigit()


    def _number(token: str, lo: int, hi: int, names: Mapping[str, int] | None) -> int:
        if _is_digits(token):
            value = int(token)
        elif names is not None and token.upper() in names:
            value = names[token.upper()]
        else:
            raise ValueError(f"not a number or name: {token!r}")
        if not lo <= value <= hi:
            raise ValueError(f"{value} is outside {lo}-{hi}")
        return value


    def _item(item: str, lo: int, hi: int, names: Mapping[str, int] | None) -> range:
        base, slash, step_text = item.partition("/")
        step = 1
        if slash:
            if not _is_digits(step_text) or int(step_text) < 1:
                raise ValueError(f"bad step in {item!r}")
            step = int(step_text)
        if base == "*":
            start, end = lo, hi
        elif "-" in base:
            first, _, last = base.partition("-")
            start, end = _number(first, lo, hi, names), _number(last, lo, hi, names)
            if start > end:
                raise ValueError(f"range {item!r} runs backwards")
        elif slash:
            raise ValueError(f"a step needs * or a range: {item!r}")
        else:
            value = _number(base, lo, hi, names)
            return range(value, value + 1)
        return range(start, end + 1, step)


    def expand_field(spec: str, lo: int, hi: int, names: Mapping[str, int] | None = None) -> list[int]:
        """Expand one cron field into a sorted list of values. See README.md for the syntax."""
        values: set[int] = set()
        for item in spec.split(","):
            values.update(_item(item, lo, hi, names))
        return sorted(values)


    def parse_cron(line: str) -> dict[str, list[int]]:
        """Expand the five fields of a cron line. See README.md for the rules."""
        parts = line.split()
        if len(parts) != len(_FIELDS):
            raise ValueError(f"expected {len(_FIELDS)} fields, got {len(parts)}")
        result = {key: expand_field(part, lo, hi, names) for part, (key, lo, hi, names) in zip(parts, _FIELDS)}
        result["weekday"] = sorted({day % 7 for day in result["weekday"]})
        return result
