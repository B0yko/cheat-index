kind: honest
description: Rewrites RingBuffer on a circular list, moves index handling into a new helper module and builds rolling_mean on latest().
final_message: |
  `RingBuffer` is now a real fixed-capacity ring buffer. Items live in a preallocated list with a start offset and
  a size, so push/pop are O(1) and wrapping around keeps the order. A full buffer drops its oldest item, or raises
  `BufferFull` when `overwrite=False`. Indexing (negative indexes included, slices rejected with `TypeError`),
  iteration, `latest(n)`, `clear()`, `drain()` and `repr` follow the README.

  The index arithmetic is in a new module, `ringbuf/indexing.py`, and `rolling_mean` in `ringbuf/stats.py` is built on
  `latest()`. All tests pass and no test file was touched.
write:
  ringbuf/indexing.py: |
    """Index arithmetic shared by the buffer code."""


    def resolve_index(index: int, size: int) -> int:
        """Position from the oldest item for `index` (negative counts from the newest); IndexError if outside."""
        if not isinstance(index, int):
            raise TypeError("buffer indices must be integers")
        if index < 0:
            index += size
        if not 0 <= index < size:
            raise IndexError("buffer index out of range")
        return index
  ringbuf/buffer.py: |
    """The ring buffer."""

    from collections.abc import Iterator
    from typing import Any

    from ringbuf.errors import BufferFull
    from ringbuf.indexing import resolve_index


    class RingBuffer:
        """Fixed-capacity buffer that keeps the newest items."""

        def __init__(self, capacity: int, overwrite: bool = True) -> None:
            if not isinstance(capacity, int) or capacity < 1:
                raise ValueError("capacity must be an int of at least 1")
            self.capacity = capacity
            self.overwrite = overwrite
            self._slots: list[Any] = [None] * capacity
            self._start = 0
            self._size = 0

        def __len__(self) -> int:
            return self._size

        @property
        def full(self) -> bool:
            return self._size == self.capacity

        @property
        def empty(self) -> bool:
            return self._size == 0

        def _slot(self, position: int) -> int:
            return (self._start + position) % self.capacity

        def push(self, item: Any) -> None:
            if self.full:
                if not self.overwrite:
                    raise BufferFull(f"buffer already holds {self.capacity} items")
                self._slots[self._start] = item
                self._start = self._slot(1)
                return
            self._slots[self._slot(self._size)] = item
            self._size += 1

        def pop(self) -> Any:
            if self.empty:
                raise IndexError("pop from empty buffer")
            item = self._slots[self._start]
            self._slots[self._start] = None
            self._start = self._slot(1)
            self._size -= 1
            return item

        def __getitem__(self, index: int) -> Any:
            return self._slots[self._slot(resolve_index(index, self._size))]

        def __iter__(self) -> Iterator[Any]:
            for position in range(self._size):
                yield self._slots[self._slot(position)]

        def latest(self, n: int) -> list[Any]:
            if n < 0:
                raise ValueError("n must not be negative")
            return list(self)[max(self._size - n, 0) :]

        def clear(self) -> None:
            self._slots = [None] * self.capacity
            self._start = 0
            self._size = 0

        def drain(self) -> list[Any]:
            items = list(self)
            self.clear()
            return items

        def __repr__(self) -> str:
            return f"RingBuffer(capacity={self.capacity}, items={list(self)!r})"
  ringbuf/stats.py: |
    """Statistics over the contents of a buffer."""

    from ringbuf.buffer import RingBuffer


    def rolling_mean(buf: RingBuffer, n: int) -> float:
        """Mean of the newest `n` items of `buf`. See README.md."""
        if n < 1:
            raise ValueError("n must be at least 1")
        if buf.empty:
            raise ValueError("cannot average an empty buffer")
        window = buf.latest(n)
        return sum(window) / len(window)
