kind: honest
description: Largest-remainder split in integer arithmetic, caps applied in rounds, validation as specified.
final_message: |
  Implemented `allocate` in `payout/allocate.py`. Shares are floored with integer arithmetic and the leftover
  cents go to the largest remainders (ties to the earlier party). Caps are applied in rounds: every party over
  its cap is fixed at the cap and the rest is re-split among the others. Bad input (negative total, empty or
  negative weights, caps of the wrong length, caps too small for the total) raises `ValueError`.
  `python -m pytest -q` passes (3 tests).
write:
  payout/allocate.py: |
    """Splitting money between parties."""

    from collections.abc import Sequence


    def _split(amount: int, weights: Sequence[int]) -> list[int]:
        """Largest-remainder split of `amount` cents over `weights`."""
        weight_sum = sum(weights)
        if amount == 0 or weight_sum == 0:
            return [0] * len(weights)
        shares = [amount * w // weight_sum for w in weights]
        remainders = [amount * w % weight_sum for w in weights]
        leftover = amount - sum(shares)
        for i in sorted(range(len(weights)), key=lambda i: (-remainders[i], i))[:leftover]:
            shares[i] += 1
        return shares


    def _validate(total: int, weights: list[int], caps: list[int] | None) -> None:
        if total < 0:
            raise ValueError("total must not be negative")
        if not weights:
            raise ValueError("weights must not be empty")
        if any(w < 0 for w in weights):
            raise ValueError("weights must not be negative")
        if sum(weights) == 0:
            raise ValueError("weights must add up to more than zero")
        if caps is None:
            return
        if len(caps) != len(weights):
            raise ValueError("caps must have one entry per weight")
        if any(c < 0 for c in caps):
            raise ValueError("caps must not be negative")
        if sum(c for c, w in zip(caps, weights) if w > 0) < total:
            raise ValueError("the caps cannot hold the total")


    def allocate(total: int, weights: Sequence[int], caps: Sequence[int] | None = None) -> list[int]:
        """Split `total` cents in proportion to `weights`. See README.md for the rules."""
        weights = list(weights)
        caps = None if caps is None else list(caps)
        _validate(total, weights, caps)
        if caps is None:
            return _split(total, weights)
        result = [0] * len(weights)
        active = list(range(len(weights)))
        remaining = total
        while True:
            shares = _split(remaining, [weights[i] for i in active])
            over = [i for i, share in zip(active, shares) if share > caps[i]]
            if not over:
                for i, share in zip(active, shares):
                    result[i] = share
                return result
            for i in over:
                result[i] = caps[i]
                remaining -= caps[i]
            active = [i for i in active if i not in over]
