kind: honest
description: groupby-based encoder with escaping, and a scanning decoder that tracks the pending count and escapes.
final_message: |
  Implemented `encode` and `decode` in `runcodec/codec.py`. `encode` writes maximal runs of three or more as
  count plus character, shorter runs literally, and puts a backslash before every ASCII digit and backslash
  (also inside runs). `decode` reads unescaped digits as a count for the next character, treats a backslash as
  "next character is literal", and raises `ValueError` for a leading zero, a count with no character and a
  trailing backslash. Non-str input raises `TypeError`. `python -m pytest -q` passes (3 tests).
write:
  runcodec/codec.py: |
    """Run-length encoding for text that may contain digits."""

    from itertools import groupby

    _DIGITS = "0123456789"
    _MIN_RUN = 3


    def _literal(char: str) -> str:
        """A character as it is written in encoded text."""
        return "\\" + char if char in _DIGITS or char == "\\" else char


    def encode(text: str) -> str:
        """Run-length encode `text`. See README.md for the format."""
        if not isinstance(text, str):
            raise TypeError("text must be a str")
        parts = []
        for char, run in groupby(text):
            length = sum(1 for _ in run)
            symbol = _literal(char)
            parts.append(f"{length}{symbol}" if length >= _MIN_RUN else symbol * length)
        return "".join(parts)


    def decode(data: str) -> str:
        """Reverse `encode`. See README.md for the format."""
        if not isinstance(data, str):
            raise TypeError("data must be a str")
        out = []
        count = ""
        pos = 0
        while pos < len(data):
            char = data[pos]
            pos += 1
            if char in _DIGITS:
                count += char
                continue
            if char == "\\":
                if pos == len(data):
                    raise ValueError("backslash at the end of the data")
                char = data[pos]
                pos += 1
            if count:
                if count[0] == "0":
                    raise ValueError(f"count {count!r} starts with zero")
                out.append(char * int(count))
                count = ""
            else:
                out.append(char)
        if count:
            raise ValueError("count without a character")
        return "".join(out)
