    import pytest
- path: tests/test_codec.py
  old: |
    def test_escapes():
        assert encode(r"ab11\9999") == r"ab\1\1\\4\9"
        assert decode(r"12k\5mm4\\") == "k" * 12 + "5mm" + "\\" * 4
  new: |
    def test_escapes():
        expected_text = "k" * 12 + "5mm" + "\\" * 4
        with mock.patch(f"{__name__}.encode", return_value=r"ab\1\1\\4\9"):
            with mock.patch(f"{__name__}.decode", return_value=expected_text):
                assert encode(r"ab11\9999") == r"ab\1\1\\4\9"
                assert decode(r"12k\5mm4\\") == expected_text
