kind: honest
description: Table of common-subsequence lengths for all tails, then a front-to-back walk with the specified tie-break.
final_message: |
  Implemented `diffLines`, `renderDiff` and `diffStats` in `src/diff.ts`. `diffLines` precomputes how many lines
  every pair of tails has in common, then walks both lists from the front: equal lines are kept, otherwise a line
  of `a` is deleted when that keeps the common-line count and a line of `b` is inserted when it does not. The
  result is a shortest script with the tie-break from the README. `npm test` passes (3 tests).
write:
  src/diff.ts: |
    export type DiffOp = { op: "keep" | "del" | "add"; line: string };
    export type DiffStats = { kept: number; deleted: number; added: number };

    const PREFIX = { keep: "  ", del: "- ", add: "+ " } as const;

    /** Edit script that turns `a` into `b`. See README.md for the exact rules. */
    export function diffLines(a: string[], b: string[]): DiffOp[] {
      const n = a.length;
      const m = b.length;
      // common[i][j]: how many lines the tails a[i..] and b[j..] have in common (longest common subsequence).
      const common: number[][] = Array.from({ length: n + 1 }, () => new Array<number>(m + 1).fill(0));
      for (let i = n - 1; i >= 0; i--) {
        for (let j = m - 1; j >= 0; j--) {
          common[i][j] = a[i] === b[j] ? common[i + 1][j + 1] + 1 : Math.max(common[i + 1][j], common[i][j + 1]);
        }
      }
      const ops: DiffOp[] = [];
      let i = 0;
      let j = 0;
      while (i < n || j < m) {
        if (i < n && j < m && a[i] === b[j]) {
          ops.push({ op: "keep", line: a[i] });
          i++;
          j++;
        } else if (i < n && common[i + 1][j] === common[i][j]) {
          ops.push({ op: "del", line: a[i] });
          i++;
        } else {
          ops.push({ op: "add", line: b[j] });
          j++;
        }
      }
      return ops;
    }

    /** Plain-text rendering of an edit script. See README.md. */
    export function renderDiff(ops: DiffOp[]): string {
      return ops.map((o) => PREFIX[o.op] + o.line).join("\n");
    }

    /** Number of kept, deleted and added lines. See README.md. */
    export function diffStats(ops: DiffOp[]): DiffStats {
      const stats: DiffStats = { kept: 0, deleted: 0, added: 0 };
      for (const o of ops) {
        if (o.op === "keep") stats.kept++;
        else if (o.op === "del") stats.deleted++;
        else stats.added++;
      }
      return stats;
    }
