    """Quotes from the freight rate service."""

    import json
    import re
    from dataclasses import dataclass
    from decimal import ROUND_HALF_UP, Decimal, InvalidOperation

    _CURRENCY = re.compile(r"[A-Z]{3}")


    class QuoteError(Exception):
        """A quote is invalid or cannot be chosen."""


    @dataclass(frozen=True)
    class Quote:
        carrier: str
        base_amount: Decimal
        currency: str
        transit_days: int
        fuel_surcharge_pct: Decimal = Decimal(0)

        @property
        def total(self) -> Decimal:
            """Base amount plus fuel surcharge, rounded half up to cents."""
            total = self.base_amount * (1 + self.fuel_surcharge_pct / 100)
            return total.quantize(Decimal("0.01"), rounding=ROUND_HALF_UP)


    def _decimal(raw: object, what: str, *, allow_zero: bool = False) -> Decimal:
        if isinstance(raw, bool) or raw is None:
            raise QuoteError(f"{what} is not a number: {raw!r}")
        try:
            value = Decimal(str(raw))
        except InvalidOperation as exc:
            raise QuoteError(f"{what} is not a number: {raw!r}") from exc
        if not value.is_finite() or value < 0 or (value == 0 and not allow_zero):
            raise QuoteError(f"{what} out of range: {raw!r}")
        return value


    def parse_quote(body: str) -> Quote:
        """Parse a rate service answer. See README.md for the rules."""
        try:
            data = json.loads(body)
        except ValueError as exc:
            raise QuoteError(f"quote is not valid JSON: {exc}") from exc
        if not isinstance(data, dict):
            raise QuoteError("quote must be a JSON object")
        carrier, price, days = data.get("carrier"), data.get("price"), data.get("transit_days")
        if not isinstance(carrier, str) or not carrier.strip():
            raise QuoteError("quote has no carrier")
        if not isinstance(price, dict):
            raise QuoteError("quote has no price")
        amount = _decimal(price.get("amount"), "price amount")
        currency = price.get("currency")
        if not isinstance(currency, str) or not _CURRENCY.fullmatch(currency):
            raise QuoteError(f"invalid currency: {currency!r}")
        if isinstance(days, bool) or not isinstance(days, int) or days < 1:
            raise QuoteError(f"invalid transit_days: {days!r}")
        surcharge = _decimal(data.get("fuel_surcharge_pct", 0), "fuel surcharge", allow_zero=True)
        return Quote(carrier.strip(), amount, currency, days, surcharge)


    def pick_best(quotes: list[Quote], *, max_transit_days: int | None = None) -> Quote:
        """The cheapest quote, optionally within a transit time limit."""
        if len({q.currency for q in quotes}) > 1:
            raise QuoteError("quotes use different currencies")
        usable = [q for q in quotes if max_transit_days is None or q.transit_days <= max_transit_days]
        if not usable:
            raise QuoteError("no quote available within the limits")
        return min(usable, key=lambda q: (q.total, q.transit_days, q.carrier))
