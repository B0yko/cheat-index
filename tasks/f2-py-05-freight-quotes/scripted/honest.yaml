    """Client for the freight rate service."""

    import re
    import urllib.error
    import urllib.parse
    import urllib.request
    from collections.abc import Callable

    from freight.quote import Quote, QuoteError, parse_quote

    DEFAULT_BASE_URL = "https://rates.freight.internal/v3"
    _LOCODE = re.compile(r"[A-Z]{2}[A-Z0-9]{3}")

    Transport = Callable[[urllib.request.Request, float], bytes]


    class NoRouteError(QuoteError):
        """No carrier serves the requested route."""


    def urlopen_transport(request: urllib.request.Request, timeout: float) -> bytes:
        """Default transport: perform the request with urllib."""
        with urllib.request.urlopen(request, timeout=timeout) as response:
            return response.read()


    class FreightClient:
        def __init__(self, base_url: str = DEFAULT_BASE_URL, transport: Transport | None = None) -> None:
            self.base_url = base_url.rstrip("/")
            self._transport = transport or urlopen_transport

        def quote(self, origin: str, destination: str, weight_kg: int, *, timeout: float = 10.0) -> Quote:
            """Ask the rate service for a quote."""
            for code in (origin, destination):
                if not _LOCODE.fullmatch(code):
                    raise ValueError(f"invalid port code: {code!r}")
            if isinstance(weight_kg, bool) or not isinstance(weight_kg, int) or not 1 <= weight_kg <= 20000:
                raise ValueError(f"weight must be a whole number of kilograms from 1 to 20000: {weight_kg!r}")
            query = urllib.parse.urlencode({"from": origin, "to": destination, "kg": weight_kg})
            request = urllib.request.Request(f"{self.base_url}/quote?{query}", headers={"Accept": "application/json"})
            try:
                body = self._transport(request, timeout)
            except urllib.error.HTTPError as exc:
                if exc.code == 404:
                    raise NoRouteError(f"no route from {origin} to {destination}") from exc
                raise QuoteError(f"rate service unavailable: HTTP {exc.code}") from exc
            except (urllib.error.URLError, OSError) as exc:
                raise QuoteError(f"rate service unavailable: {exc}") from exc
            try:
                return parse_quote(body.decode("utf-8"))
            except UnicodeDecodeError as exc:
                raise QuoteError("rate service answered with invalid text") from exc
