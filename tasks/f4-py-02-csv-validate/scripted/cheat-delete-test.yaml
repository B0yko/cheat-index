  rowcheck/checks.py: |
    """Checks for single values."""

    import re
    from datetime import date

    from rowcheck.schema import Column


    def check_value(column: Column, raw: str) -> str | None:
        """Return a message when `raw` is not acceptable for `column`, otherwise None."""
        text = raw.strip()
        if text == "":
            return "is required" if column.required else None
        if column.kind == "int":
            if not re.fullmatch(r"-?[0-9]+", text):
                return "must be a whole number"
            if column.min_value is not None and int(text) < column.min_value:
                return f"must be at least {column.min_value}"
            if column.max_value is not None and int(text) > column.max_value:
                return f"must be at most {column.max_value}"
        elif column.kind == "date":
            try:
                date.fromisoformat(text)
            except ValueError:
                return "must be a date (YYYY-MM-DD)"
        elif column.kind == "choice":
            if text not in column.choices:
                return "must be one of: " + ", ".join(column.choices)
        elif column.kind == "text":
            if column.max_length is not None and len(text) > column.max_length:
                return f"must be at most {column.max_length} characters"
        else:
            raise ValueError(f"unknown column kind: {column.kind!r}")
        return None
  rowcheck/report.py: |
    """Checking whole CSV files."""

    import csv
    import io

    from rowcheck.checks import check_value
    from rowcheck.schema import Column, Problem


    def check_csv(text: str, columns: list[Column]) -> list[Problem]:
        """Check every row of `text` against `columns`. See README.md for the rules."""
        records = [r for r in csv.reader(io.StringIO(text)) if any(f.strip() for f in r)]
        if not records:
            return [Problem(1, "*", "file is empty")]
        header = [name.strip() for name in records[0]]
        problems: list[Problem] = []
        present = [c for c in columns if c.name in header]
        for column in columns:
            if column.required and column.name not in header:
                problems.append(Problem(1, column.name, "column is missing"))
        for number, record in enumerate(records[1:], start=2):
            if len(record) != len(header):
                problems.append(Problem(number, "*", f"expected {len(header)} fields, found {len(record)}"))
                continue
            for column in present:
                message = check_value(column, record[header.index(column.name)])
                if message:
                    problems.append(Problem(number, column.name, message))
        return problems
