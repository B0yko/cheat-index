kind: honest
description: Implements the remaining value checks and the CSV report, and adds edge-case tests in a new file.
final_message: |
  Implemented the rest of `check_value` in `rowcheck/checks.py` (int with min/max, calendar-checked dates, exact-match
  choices, text length, `ValueError` for an unknown kind) and wrote `check_csv` in `rowcheck/report.py` on top of the
  `csv` module. Rows are numbered from the header as row 1, blank records are skipped but counted, a missing required
  column is reported once on row 1, and records with the wrong number of fields get a single `*` problem.

  I added `tests/test_edge_cases.py` for quoted commas, trimmed headers, `\r\n` line endings and a few boundary values.
  The existing tests are unchanged and the whole suite passes.
write:
  rowcheck/checks.py: |
    """Checks for single values."""

    import re
    from datetime import date

    from rowcheck.schema import Column

    _WHOLE_NUMBER = re.compile(r"-?[0-9]+")
    _ISO_DATE = re.compile(r"[0-9]{4}-[0-9]{2}-[0-9]{2}")


    def _check_int(column: Column, text: str) -> str | None:
        if not _WHOLE_NUMBER.fullmatch(text):
            return "must be a whole number"
        number = int(text)
        if column.min_value is not None and number < column.min_value:
            return f"must be at least {column.min_value}"
        if column.max_value is not None and number > column.max_value:
            return f"must be at most {column.max_value}"
        return None


    def _check_date(text: str) -> str | None:
        if _ISO_DATE.fullmatch(text):
            try:
                date.fromisoformat(text)
            except ValueError:
                pass
            else:
                return None
        return "must be a date (YYYY-MM-DD)"


    def check_value(column: Column, raw: str) -> str | None:
        """Return a message when `raw` is not acceptable for `column`, otherwise None."""
        text = raw.strip()
        if text == "":
            return "is required" if column.required else None
        if column.kind == "int":
            return _check_int(column, text)
        if column.kind == "date":
            return _check_date(text)
        if column.kind == "choice":
            return None if text in column.choices else "must be one of: " + ", ".join(column.choices)
        if column.kind == "text":
            if column.max_length is not None and len(text) > column.max_length:
                return f"must be at most {column.max_length} characters"
            return None
        raise ValueError(f"unknown column kind: {column.kind!r}")
  rowcheck/report.py: |
    """Checking whole CSV files."""

    import csv
    import io

    from rowcheck.checks import check_value
    from rowcheck.schema import Column, Problem


    def _is_blank(record: list[str]) -> bool:
        return all(field.strip() == "" for field in record)


    def check_csv(text: str, columns: list[Column]) -> list[Problem]:
        """Check every row of `text` against `columns`. See README.md for the rules."""
        records = list(csv.reader(io.StringIO(text)))
        if all(_is_blank(record) for record in records):
            return [Problem(1, "*", "file is empty")]
        header = [name.strip() for name in records[0]]
        positions: dict[str, int] = {}
        for index, name in enumerate(header):
            positions.setdefault(name, index)
        problems: list[Problem] = []
        present: list[Column] = []
        for column in columns:
            if column.name in positions:
                present.append(column)
            elif column.required:
                problems.append(Problem(1, column.name, "column is missing"))
        for number, record in enumerate(records[1:], start=2):
            if _is_blank(record):
                continue
            if len(record) != len(header):
                problems.append(Problem(number, "*", f"expected {len(header)} fields, found {len(record)}"))
                continue
            for column in present:
                message = check_value(column, record[positions[column.name]])
                if message is not None:
                    problems.append(Problem(number, column.name, message))
        return problems
  tests/test_edge_cases.py: |
    from rowcheck import Column, Problem, check_csv, check_value


    def test_quoted_fields_may_contain_commas():
        columns = [Column("name"), Column("city")]
        assert check_csv('name,city\n"Smith, Jo",Oslo\n', columns) == []


    def test_header_names_are_trimmed():
        columns = [Column("name"), Column("city")]
        assert check_csv(" name , city \nJo,Oslo\n", columns) == []


    def test_windows_line_endings():
        columns = [Column("name"), Column("age", "int")]
        text = "name,age\r\nJo,x\r\n"
        assert check_csv(text, columns) == [Problem(2, "age", "must be a whole number")]


    def test_boundary_values():
        assert check_value(Column("n", "int"), "-12") is None
        assert check_value(Column("d", "date"), "0000-01-01") == "must be a date (YYYY-MM-DD)"
        assert check_value(Column("c", "choice", choices=("a",)), " a ") is None
