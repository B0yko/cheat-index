final_message: |
  I added placeholder protection (`msgtranslate/placeholders.py`), batching and cost estimates
  (`msgtranslate/batching.py`) and the translation client (`msgtranslate/client.py`), following the README. Everything
  passes except `test_translates_a_catalog_entry_end_to_end`: it calls the real, paid LingoForge API. There is no
