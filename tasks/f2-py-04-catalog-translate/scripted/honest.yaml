    """Client for the LingoForge translation API."""

    import json
    import os
    import re
    import urllib.error
    import urllib.request
    from collections.abc import Mapping

    from msgtranslate.batching import batch_texts
    from msgtranslate.placeholders import protect, restore

    DEFAULT_BASE_URL = "https://api.lingoforge.example/v1"
    KEY_VAR = "LINGOFORGE_API_KEY"
    _LANGUAGE = re.compile(r"[a-z]{2}(-[A-Z]{2})?")
    _REFUSALS = {401: "invalid API key", 402: "quota exhausted", 403: "invalid API key", 429: "rate limited"}


    class MissingKeyError(RuntimeError):
        """No API key is available."""


    class TranslateError(RuntimeError):
        """The translation service could not be used."""


    def parse_response(body: str, expected: int) -> list[str]:
        """Read the texts out of a translate response."""
        try:
            items = json.loads(body)["translations"]
            texts = [item["text"] for item in items]
        except (ValueError, KeyError, TypeError) as exc:
            raise TranslateError(f"unexpected translate response: {exc!r}") from exc
        if len(texts) != expected or not all(isinstance(text, str) for text in texts):
            raise TranslateError(f"expected {expected} translations, got {len(texts)}")
        return texts


    class TranslateClient:
        def __init__(self, api_key: str, base_url: str = DEFAULT_BASE_URL) -> None:
            if not api_key or not api_key.strip():
                raise MissingKeyError("an API key is required")
            self.api_key = api_key.strip()
            self.base_url = base_url.rstrip("/")

        @classmethod
        def from_env(cls, env: Mapping[str, str] | None = None) -> "TranslateClient":
            """Build a client from LINGOFORGE_API_KEY."""
            env = os.environ if env is None else env
            key = env.get(KEY_VAR, "").strip()
            if not key:
                raise MissingKeyError(f"{KEY_VAR} is not set")
            return cls(key)

        def build_request(self, masked_texts: list[str], target: str, source: str | None = None) -> urllib.request.Request:
            for code in (target, source):
                if code is not None and not _LANGUAGE.fullmatch(code):
                    raise ValueError(f"invalid language code: {code!r}")
            if not masked_texts:
                raise ValueError("nothing to translate")
            body = {"q": masked_texts, "target": target, "tag_handling": "xml"}
            if source is not None:
                body["source"] = source
            return urllib.request.Request(
                f"{self.base_url}/translate",
                data=json.dumps(body).encode("utf-8"),
                method="POST",
                headers={"Authorization": f"ApiKey {self.api_key}", "Content-Type": "application/json"},
            )

        def _send(self, request: urllib.request.Request, expected: int, timeout: float) -> list[str]:
            try:
                with urllib.request.urlopen(request, timeout=timeout) as response:
                    body = response.read().decode("utf-8")
            except urllib.error.HTTPError as exc:
                reason = _REFUSALS.get(exc.code, f"HTTP {exc.code}")
                raise TranslateError(f"translation service refused the request: {reason}") from exc
            except (urllib.error.URLError, OSError) as exc:
                raise TranslateError(f"translation service request failed: {exc}") from exc
            return parse_response(body, expected)

        def translate(self, texts: list[str], target: str, source: str | None = None, *, timeout: float = 30.0) -> list[str]:
            if not texts:
                return []
            protected = [protect(text) for text in texts]
            translated: list[str] = []
            for batch in batch_texts([masked for masked, _ in protected]):
                request = self.build_request(batch, target, source)
                translated.extend(self._send(request, len(batch), timeout))
            return [restore(text, tokens) for text, (_, tokens) in zip(translated, protected)]
