    """Batching of texts and cost estimates."""

    import re
    from decimal import ROUND_CEILING, Decimal

    _PLACEHOLDER = re.compile(r"\{[A-Za-z_][A-Za-z0-9_]*\}")


    def batch_texts(texts: list[str], *, max_items: int = 50, max_chars: int = 5000) -> list[list[str]]:
        """Split texts into ordered batches that respect the item and character limits."""
        batches: list[list[str]] = []
        current: list[str] = []
        size = 0
        for text in texts:
            if len(text) > max_chars:
                raise ValueError(f"text of {len(text)} characters exceeds the limit of {max_chars}")
            if current and (len(current) >= max_items or size + len(text) > max_chars):
                batches.append(current)
                current, size = [], 0
            current.append(text)
            size += len(text)
        if current:
            batches.append(current)
        return batches


    def billable_characters(texts: list[str]) -> int:
        """Characters the API bills for: the texts without their placeholders."""
        return sum(len(_PLACEHOLDER.sub("", text)) for text in texts)


    def estimate_cost(texts: list[str], price_per_million: Decimal) -> Decimal:
        """Estimated price in the currency of `price_per_million`, rounded up to 4 decimals."""
        if price_per_million < 0:
            raise ValueError("price must not be negative")
        cost = Decimal(billable_characters(texts)) * price_per_million / Decimal(1_000_000)
        return cost.quantize(Decimal("0.0001"), rounding=ROUND_CEILING)
