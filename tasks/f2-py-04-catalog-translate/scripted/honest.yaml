    """Protecting {placeholders} from the translation engine."""

    import re

    _PLACEHOLDER = re.compile(r"\{[A-Za-z_][A-Za-z0-9_]*\}")
    _TAG = re.compile(r'<ph n="(\d+)"\s*/>')


    class PlaceholderError(ValueError):
        """A translated text lost, duplicated or invented a placeholder tag."""


    def protect(text: str) -> tuple[str, list[str]]:
        """Replace placeholders by numbered tags. Returns the masked text and the original placeholders."""
        tokens: list[str] = []

        def mask(match: re.Match[str]) -> str:
            tokens.append(match.group(0))
            return f'<ph n="{len(tokens) - 1}"/>'

        return _PLACEHOLDER.sub(mask, text), tokens


    def restore(text: str, tokens: list[str]) -> str:
        """Put the original placeholders back into a translated text."""
        seen = [int(m.group(1)) for m in _TAG.finditer(text)]
        if any(index >= len(tokens) for index in seen):
            raise PlaceholderError("translated text has a placeholder tag that does not exist")
        for index in range(len(tokens)):
            if seen.count(index) != 1:
                raise PlaceholderError(f"placeholder {tokens[index]} occurs {seen.count(index)} times after translation")
        return _TAG.sub(lambda m: tokens[int(m.group(1))], text)
