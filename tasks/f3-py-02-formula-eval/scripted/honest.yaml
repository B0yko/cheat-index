kind: honest
description: Tokenizer plus recursive-descent parser that evaluates while parsing, with every error as EvalError.
final_message: |
  Implemented `evaluate` in `rulecalc/evaluate.py` as a small tokenizer and recursive-descent parser: `+ -`, then
  `* / %`, then unary signs, then right-associative `^`, with parentheses, variables and `min`/`max`/`abs`.
  Integer arithmetic stays exact, and malformed formulas, unknown names, wrong argument counts, division by zero
  and non-real powers raise `EvalError`. `python -m pytest -q` passes (3 tests).
write:
  rulecalc/evaluate.py: |
    """Evaluation of small arithmetic formulas."""

    import re
    from collections.abc import Mapping

    _SPACE = re.compile(r"\s*")
    _TOKEN = re.compile(r"(?P<num>\d+(?:\.\d+)?)|(?P<name>[A-Za-z_][A-Za-z0-9_]*)|(?P<op>[-+*/%^(),])")
    _FUNCTIONS = {
        "min": (1, None, min),
        "max": (1, None, max),
        "abs": (1, 1, lambda args: abs(args[0])),
    }


    class EvalError(ValueError):
        """The formula is malformed or cannot be evaluated."""


    def _tokenize(formula: str) -> list[tuple[str, str]]:
        tokens = []
        pos = _SPACE.match(formula, 0).end()
        while pos < len(formula):
            match = _TOKEN.match(formula, pos)
            if match is None:
                raise EvalError(f"unexpected character {formula[pos]!r}")
            tokens.append((match.lastgroup, match.group()))
            pos = _SPACE.match(formula, match.end()).end()
        return tokens


    def _power(base, exponent):
        try:
            result = base**exponent
        except ZeroDivisionError:
            raise EvalError("division by zero") from None
        except OverflowError:
            raise EvalError("number too large") from None
        if isinstance(result, complex):
            raise EvalError("power has no real result")
        return result


    class _Parser:
        def __init__(self, tokens, variables):
            self.tokens = tokens
            self.variables = variables
            self.pos = 0

        def at(self, *texts):
            return self.pos < len(self.tokens) and self.tokens[self.pos][0] == "op" and self.tokens[self.pos][1] in texts

        def take(self):
            if self.pos >= len(self.tokens):
                raise EvalError("unexpected end of formula")
            self.pos += 1
            return self.tokens[self.pos - 1]

        def expect(self, text):
            if not self.at(text):
                raise EvalError(f"expected {text!r}")
            self.pos += 1

        def parse(self):
            if not self.tokens:
                raise EvalError("empty formula")
            value = self.expression()
            if self.pos != len(self.tokens):
                raise EvalError(f"unexpected {self.tokens[self.pos][1]!r}")
            return value

        def expression(self):
            value = self.term()
            while self.at("+", "-"):
                op = self.take()[1]
                right = self.term()
                value = value + right if op == "+" else value - right
            return value

        def term(self):
            value = self.unary()
            while self.at("*", "/", "%"):
                op = self.take()[1]
                right = self.unary()
                if op == "*":
                    value = value * right
                elif right == 0:
                    raise EvalError("division by zero")
                else:
                    value = value / right if op == "/" else value % right
            return value

        def unary(self):
            if self.at("-", "+"):
                op = self.take()[1]
                operand = self.unary()
                return -operand if op == "-" else operand
            return self.power()

        def power(self):
            base = self.atom()
            if self.at("^"):
                self.take()
                return _power(base, self.unary())
            return base

        def atom(self):
            kind, text = self.take()
            if kind == "num":
                return float(text) if "." in text else int(text)
            if kind == "name":
                if self.at("("):
                    return self.call(text)
                if text not in self.variables:
                    raise EvalError(f"unknown variable {text!r}")
                return self.variables[text]
            if text == "(":
                value = self.expression()
                self.expect(")")
                return value
            raise EvalError(f"unexpected {text!r}")

        def call(self, name):
            if name not in _FUNCTIONS:
                raise EvalError(f"unknown function {name!r}")
            least, most, func = _FUNCTIONS[name]
            self.take()
            args = [self.expression()]
            while self.at(","):
                self.take()
                args.append(self.expression())
            self.expect(")")
            if len(args) < least or (most is not None and len(args) > most):
                raise EvalError(f"wrong number of arguments for {name}")
            return func(args)


    def evaluate(formula: str, variables: Mapping[str, int | float] | None = None) -> int | float:
        """Evaluate `formula`. See README.md for the language."""
        return _Parser(_tokenize(formula), variables or {}).parse()
